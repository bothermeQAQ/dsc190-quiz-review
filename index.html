const INITIAL=[{"id":"01-intro:What does the `-a` flag do in the `ls` command?","lecture":1,"title":"Intro","topic":"The `ls` command","q":"What does the `-a` flag do in the `ls` command?","a":"shows all files, including hidden files (starting with a dot)","path":"lectures/01-intro/YSK.md"},{"id":"01-intro:What does the `-l` flag do in the `ls` command?","lecture":1,"title":"Intro","topic":"The `ls` command","q":"What does the `-l` flag do in the `ls` command?","a":"shows files in long format (permissions, owner, size, date, name)","path":"lectures/01-intro/YSK.md"},{"id":"01-intro:What does the `-r` flag do in the `rm` command?","lecture":1,"title":"Intro","topic":"The `ls` command","q":"What does the `-r` flag do in the `rm` command?","a":"removes directories and their contents recursively","path":"lectures/01-intro/YSK.md"},{"id":"02-shell:What does `rm foo/` do if foo is a directory?","lecture":2,"title":"Shell","topic":"The `rm` command","q":"What does `rm foo/` do if foo is a directory?","a":"prints an error because `rm` by default only removes files, not directories","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `rm -r` do?","lecture":2,"title":"Shell","topic":"The `rm` command","q":"What does `rm -r` do?","a":"removes a directory and everything inside it recursively","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `rm -rf` do?","lecture":2,"title":"Shell","topic":"The `rm` command","q":"What does `rm -rf` do?","a":"removes recursively and forcefully, without prompting for confirmation","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `mkdir` do?","lecture":2,"title":"Shell","topic":"The `mkdir` command","q":"What does `mkdir` do?","a":"creates a new directory","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `mv` do?","lecture":2,"title":"Shell","topic":"The `mv` command","q":"What does `mv` do?","a":"moves a file or directory to a new location","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What command is used to rename a single file?","lecture":2,"title":"Shell","topic":"The `mv` command","q":"What command is used to rename a single file?","a":"`mv <old-name> <new-name>`","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `cp` do?","lecture":2,"title":"Shell","topic":"The `cp` command","q":"What does `cp` do?","a":"copies a file to a new location","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does the `-r` flag do in the `cp` command?","lecture":2,"title":"Shell","topic":"The `cp` command","q":"What does the `-r` flag do in the `cp` command?","a":"copies directories and their contents recursively","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `cp -r foo/ ~` do?","lecture":2,"title":"Shell","topic":"The `cp` command","q":"What does `cp -r foo/ ~` do?","a":"copies the `foo/` directory and everything inside it to your home directory","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `less` do?","lecture":2,"title":"Shell","topic":"The `less` command","q":"What does `less` do?","a":"opens a file for viewing one screen at a time","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:How do you scroll down by one line in `less`?","lecture":2,"title":"Shell","topic":"The `less` command","q":"How do you scroll down by one line in `less`?","a":"down arrow key or `j`.","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:How do you scroll up by one line in `less`?","lecture":2,"title":"Shell","topic":"The `less` command","q":"How do you scroll up by one line in `less`?","a":"up arrow key or `k`.","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:How do you scroll down by one-half page in `less`?","lecture":2,"title":"Shell","topic":"The `less` command","q":"How do you scroll down by one-half page in `less`?","a":"`<ctrl-d>`","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:How do you scroll up by one-half page in `less`?","lecture":2,"title":"Shell","topic":"The `less` command","q":"How do you scroll up by one-half page in `less`?","a":"`<ctrl-u>`","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:How do you jump to the end of a file in `less`?","lecture":2,"title":"Shell","topic":"The `less` command","q":"How do you jump to the end of a file in `less`?","a":"press `G`","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:How do you search for text in `less`?","lecture":2,"title":"Shell","topic":"The `less` command","q":"How do you search for text in `less`?","a":"press `/` then type your search term","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:How do you quit `less`?","lecture":2,"title":"Shell","topic":"The `less` command","q":"How do you quit `less`?","a":"press `q`","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does the `man` command do?","lecture":2,"title":"Shell","topic":"Other commands","q":"What does the `man` command do?","a":"displays the manual page for a command","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does the `pwd` command do?","lecture":2,"title":"Shell","topic":"Other commands","q":"What does the `pwd` command do?","a":"prints the current working directory","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `cd` do if we don't give it any arguments?","lecture":2,"title":"Shell","topic":"The `cd` command","q":"What does `cd` do if we don't give it any arguments?","a":"changes to your home directory","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `cd -` do?","lecture":2,"title":"Shell","topic":"The `cd` command","q":"What does `cd -` do?","a":"changes to the previous directory you were in","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `cd ..` do?","lecture":2,"title":"Shell","topic":"The `cd` command","q":"What does `cd ..` do?","a":"moves up one directory level","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `cd ~` do?","lecture":2,"title":"Shell","topic":"The `cd` command","q":"What does `cd ~` do?","a":"changes to your home directory","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does pressing the up arrow key do at the command line?","lecture":2,"title":"Shell","topic":"Keyboard shortcuts","q":"What does pressing the up arrow key do at the command line?","a":"cycles through previous commands in your history","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `<Alt-left arrow>` do at the command line? (Option-left arrow on Mac)","lecture":2,"title":"Shell","topic":"Keyboard shortcuts","q":"What does `<Alt-left arrow>` do at the command line? (Option-left arrow on Mac)","a":"moves the cursor one word to the left","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `<Alt-right arrow>` do at the command line? (Option-right arrow on Mac)","lecture":2,"title":"Shell","topic":"Keyboard shortcuts","q":"What does `<Alt-right arrow>` do at the command line? (Option-right arrow on Mac)","a":"moves the cursor one word to the right","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `<Ctrl-u>` do at the command line?","lecture":2,"title":"Shell","topic":"Keyboard shortcuts","q":"What does `<Ctrl-u>` do at the command line?","a":"deletes everything from the cursor to the beginning of the line","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `<Ctrl-a>` do at the command line?","lecture":2,"title":"Shell","topic":"Keyboard shortcuts","q":"What does `<Ctrl-a>` do at the command line?","a":"moves the cursor to the beginning of the line","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `<Ctrl-e>` do at the command line?","lecture":2,"title":"Shell","topic":"Keyboard shortcuts","q":"What does `<Ctrl-e>` do at the command line?","a":"moves the cursor to the end of the line","path":"lectures/02-shell/YSK.md"},{"id":"02-shell:What does `<Ctrl-w>` do at the command line?","lecture":2,"title":"Shell","topic":"Keyboard shortcuts","q":"What does `<Ctrl-w>` do at the command line?","a":"deletes the word before the cursor","path":"lectures/02-shell/YSK.md"},{"id":"03-finding_and_editing:What is an AI agent?","lecture":3,"title":"Finding And Editing","topic":"AI agents","q":"What is an AI agent?","a":"An LLM that can call tools in a loop.","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `find . -name '*.csv'` do?","lecture":3,"title":"Finding And Editing","topic":"The `find` command","q":"What does `find . -name '*.csv'` do?","a":"recursively searches for anything with a name that ends in \".csv\" under the current directory","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `find foo/ -name 'bar'` do?","lecture":3,"title":"Finding And Editing","topic":"The `find` command","q":"What does `find foo/ -name 'bar'` do?","a":"recursively searches for things named \"bar\" (exactly) under the directory \"foo\"","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:Your current directory contains a file named \"test_backend.py\". Will `find . -name 'test'` match it?","lecture":3,"title":"Finding And Editing","topic":"The `find` command","q":"Your current directory contains a file named \"test_backend.py\". Will `find . -name 'test'` match it?","a":"No, it only matches things named exactly \"test\"","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What is the difference between `-name` and `-iname` in the `find` command?","lecture":3,"title":"Finding And Editing","topic":"The `find` command","q":"What is the difference between `-name` and `-iname` in the `find` command?","a":"`-iname` is case-insensitive, while `-name` is case-sensitive.","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `find . -type d -name 'data*'` do?","lecture":3,"title":"Finding And Editing","topic":"The `find` command","q":"What does `find . -type d -name 'data*'` do?","a":"Finds directories (not files) whose names start with \"data\".","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `find . -name 'test' -maxdepth 1` do?","lecture":3,"title":"Finding And Editing","topic":"The `find` command","q":"What does `find . -name 'test' -maxdepth 1` do?","a":"Finds things named \"test\" in the current directory, but does not search subdirectories.","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `find . -name '*.csv' -exec rm {} \\;` do?","lecture":3,"title":"Finding And Editing","topic":"The `find` command","q":"What does `find . -name '*.csv' -exec rm {} \\;` do?","a":"deletes all CSVs under the current directory and its subdirectories","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:In `find . -name '*.csv' -exec rm {} \\;`, what does `{}` represent?","lecture":3,"title":"Finding And Editing","topic":"The `find` command","q":"In `find . -name '*.csv' -exec rm {} \\;`, what does `{}` represent?","a":"a placeholder that gets replaced with the path of each found file","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `find . -type f -name '*.py' -exec grep 'foo' {} \\;` do?","lecture":3,"title":"Finding And Editing","topic":"The `find` command","q":"What does `find . -type f -name '*.py' -exec grep 'foo' {} \\;` do?","a":"Prints every line containing \"foo\" in every `.py` file in this directory and its subdirectories.","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `grep foo bar` do?","lecture":3,"title":"Finding And Editing","topic":"The `grep` command","q":"What does `grep foo bar` do?","a":"searches for the string \"foo\" in the file \"bar\" and prints matching lines","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `grep foo .` do?","lecture":3,"title":"Finding And Editing","topic":"The `grep` command","q":"What does `grep foo .` do?","a":"Prints an error, because without `-r`, grep expects a file, not a directory.","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `grep -r foo bar` do?","lecture":3,"title":"Finding And Editing","topic":"The `grep` command","q":"What does `grep -r foo bar` do?","a":"searches for the string \"foo\" in all files under the directory \"bar\" recursively","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `grep -ri foo bar` do?","lecture":3,"title":"Finding And Editing","topic":"The `grep` command","q":"What does `grep -ri foo bar` do?","a":"searches for the string \"foo\" in all files under the directory \"bar\" recursively, ignoring case","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:What does `grep -n foo bar` do?","lecture":3,"title":"Finding And Editing","topic":"The `grep` command","q":"What does `grep -n foo bar` do?","a":"searches for the string \"foo\" in the file \"bar\" and prints matching lines, prefixed with their line number","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:The file `file.txt` contains the line \"One foo bar two\". Will `grep 'foo' file.txt` return (match) that line?","lecture":3,"title":"Finding And Editing","topic":"The `grep` command","q":"The file `file.txt` contains the line \"One foo bar two\". Will `grep 'foo' file.txt` return (match) that line?","a":"Yes, it matches because \"foo\" is a substring of \"One foo bar two\"","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"03-finding_and_editing:The file `file.txt` contains the line \"ONE FOO BAR TWO\". Will `grep 'foo' file.txt` return (match) that line?","lecture":3,"title":"Finding And Editing","topic":"The `grep` command","q":"The file `file.txt` contains the line \"ONE FOO BAR TWO\". Will `grep 'foo' file.txt` return (match) that line?","a":"No, it does not match because grep is case-sensitive","path":"lectures/03-finding_and_editing/YSK.md"},{"id":"04-shell_features:How do you quit VIM?","lecture":4,"title":"Shell Features","topic":"Editing files in the terminal","q":"How do you quit VIM?","a":"Hit the escape key, type `:q` and press Enter.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does the `nano` command do?","lecture":4,"title":"Shell Features","topic":"Editing files in the terminal","q":"What does the `nano` command do?","a":"Opens a simple text editor in the terminal.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:In nano, the bottom toolbar shows a shortcut like `^X Exit`. What key combination does `^X` refer to?","lecture":4,"title":"Shell Features","topic":"Editing files in the terminal","q":"In nano, the bottom toolbar shows a shortcut like `^X Exit`. What key combination does `^X` refer to?","a":"Ctrl-X.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:A directory contains the files `data_01.txt`, `data_02.txt`, and `data.txt`. If we run `rm data???.txt`, which files will be deleted?","lecture":4,"title":"Shell Features","topic":"Globbing","q":"A directory contains the files `data_01.txt`, `data_02.txt`, and `data.txt`. If we run `rm data???.txt`, which files will be deleted?","a":"`data_01.txt` and `data_02.txt` will be deleted, but not `data.txt`.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:A directory contains the files `.hidden_data.txt`, `data_02.txt`, and `data.txt`. If we run `rm *.txt`, which files will be deleted?","lecture":4,"title":"Shell Features","topic":"Globbing","q":"A directory contains the files `.hidden_data.txt`, `data_02.txt`, and `data.txt`. If we run `rm *.txt`, which files will be deleted?","a":"`data_02.txt` and `data.txt` will be deleted, but not `.hidden_data.txt` because globbing does not match hidden files by default.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does the command `cp *.csv backup/` do?","lecture":4,"title":"Shell Features","topic":"Globbing","q":"What does the command `cp *.csv backup/` do?","a":"Copies anything in the current directory whose name ends in `.csv` into the `backup/` directory.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:Does the glob pattern `*.csv` recursively match CSV files in subdirectories of the current directory?","lecture":4,"title":"Shell Features","topic":"Globbing","q":"Does the glob pattern `*.csv` recursively match CSV files in subdirectories of the current directory?","a":"No — globbing is not recursive; it only matches files in the current directory.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What happens when you run `cp *.txt data/` in a directory that contains no `.txt` files?","lecture":4,"title":"Shell Features","topic":"Globbing","q":"What happens when you run `cp *.txt data/` in a directory that contains no `.txt` files?","a":"An error reporting that `*.txt` does not exist.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does `rm -rf *` do?","lecture":4,"title":"Shell Features","topic":"Globbing","q":"What does `rm -rf *` do?","a":"Recursively deletes everything in the current directory and below.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does `rm -r '*'` do? Notice the single quotes around `*`.","lecture":4,"title":"Shell Features","topic":"Globbing","q":"What does `rm -r '*'` do? Notice the single quotes around `*`.","a":"Deletes a single file named `*` if it exists, but does not perform glob expansion due to the quotes.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does `mkdir data_{1,2,3}` expand to?","lecture":4,"title":"Shell Features","topic":"Brace expansion","q":"What does `mkdir data_{1,2,3}` expand to?","a":"`mkdir data_1 data_2 data_3`.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does `mkdir data_{a,b}{1,2,3}` expand to?","lecture":4,"title":"Shell Features","topic":"Brace expansion","q":"What does `mkdir data_{a,b}{1,2,3}` expand to?","a":"`mkdir data_a1 data_a2 data_a3 data_b1 data_b2 data_b3`.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What is the correct way to assign a string \"Hello world!\" to a variable named `greeting`?","lecture":4,"title":"Shell Features","topic":"Variables","q":"What is the correct way to assign a string \"Hello world!\" to a variable named `greeting`?","a":"`greeting=\"Hello world!\"` or `greeting='Hello world!'` (with quotes to prevent word splitting).","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:After setting `number=42`, how do you print the value of `number` using `echo`?","lecture":4,"title":"Shell Features","topic":"Variables","q":"After setting `number=42`, how do you print the value of `number` using `echo`?","a":"`echo $number`.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:After `x=42`, what does `echo $x + 1` print?","lecture":4,"title":"Shell Features","topic":"Variables","q":"After `x=42`, what does `echo $x + 1` print?","a":"`42 + 1` — shell variables are just strings and there is no arithmetic.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm *.csv`?","lecture":4,"title":"Shell Features","topic":"Quoting and expansion","q":"The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm *.csv`?","a":"Two — `data1.csv` and `data2.csv` — because globbing is case-sensitive and does not match `data3.CSV`.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm \"*.csv\"`?","lecture":4,"title":"Shell Features","topic":"Quoting and expansion","q":"The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm \"*.csv\"`?","a":"One — the literal string `*.csv` — because quotes prevent glob expansion.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm '*.csv'`?","lecture":4,"title":"Shell Features","topic":"Quoting and expansion","q":"The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm '*.csv'`?","a":"One — the literal string `*.csv` — because single quotes also prevent glob expansion.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm *.txt`?","lecture":4,"title":"Shell Features","topic":"Quoting and expansion","q":"The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm *.txt`?","a":"One -- the literal string `*.txt` -- because there are no files matching the glob pattern, so it is not expanded.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:Suppose we set `x=\"foo bar baz\"` and run `cd $x`. How many arguments does `cd` receive?","lecture":4,"title":"Shell Features","topic":"Quoting and expansion","q":"Suppose we set `x=\"foo bar baz\"` and run `cd $x`. How many arguments does `cd` receive?","a":"Three — `foo`, `bar`, and `baz` — because the variable is expanded and then word splitting occurs on the whitespace.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:A file is named \"2026 report.txt\" (with a space in the name). What command would you use to delete this file?","lecture":4,"title":"Shell Features","topic":"Quoting and expansion","q":"A file is named \"2026 report.txt\" (with a space in the name). What command would you use to delete this file?","a":"`rm \"2026 report.txt\"` or `rm '2026 report.txt'` (with quotes to prevent word splitting on the space).","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:After setting `name=Justin`, what does `echo '$name'` print? Notice the quotes.","lecture":4,"title":"Shell Features","topic":"Quoting and expansion","q":"After setting `name=Justin`, what does `echo '$name'` print? Notice the quotes.","a":"The literal string `$name` — single quotes prevent variable expansion.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:After setting `name=Justin`, what does `echo \"$name\"` print? Notice the quotes.","lecture":4,"title":"Shell Features","topic":"Quoting and expansion","q":"After setting `name=Justin`, what does `echo \"$name\"` print? Notice the quotes.","a":"`Justin` — double quotes allow variable expansion.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does `mkdir data_$(date +%Y-%m-%d)` do?","lecture":4,"title":"Shell Features","topic":"Command substitution","q":"What does `mkdir data_$(date +%Y-%m-%d)` do?","a":"Creates a directory whose name is `data_` followed by today's date in `YYYY-MM-DD` format.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What three text streams does the shell connect to every program it runs?","lecture":4,"title":"Shell Features","topic":"I/O streams","q":"What three text streams does the shell connect to every program it runs?","a":"Standard input (stdin), standard output (stdout), and standard error (stderr).","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What is the default source of standard input for a program run in the shell?","lecture":4,"title":"Shell Features","topic":"I/O streams","q":"What is the default source of standard input for a program run in the shell?","a":"The keyboard.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What is the default destination of standard output for a program run in the shell?","lecture":4,"title":"Shell Features","topic":"I/O streams","q":"What is the default destination of standard output for a program run in the shell?","a":"The terminal.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What do you press to signal end-of-input to a program reading from stdin at the terminal?","lecture":4,"title":"Shell Features","topic":"I/O streams","q":"What do you press to signal end-of-input to a program reading from stdin at the terminal?","a":"Ctrl-D.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does the pipe operator `|` do in `ls -l | wc -l`?","lecture":4,"title":"Shell Features","topic":"Pipes","q":"What does the pipe operator `|` do in `ls -l | wc -l`?","a":"Connects the stdout of `ls` to the stdin of `wc -l`, so `wc -l` counts the number of lines `ls` produced.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does `ls -l | wc -l` compute?","lecture":4,"title":"Shell Features","topic":"Pipes","q":"What does `ls -l | wc -l` compute?","a":"The number of files and directories listed by `ls` in the current directory.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does `ps aux | grep python` do?","lecture":4,"title":"Shell Features","topic":"Pipes","q":"What does `ps aux | grep python` do?","a":"Lists all running processes and then filters them to show only lines containing `python`.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does `find . -name \"*.csv\" | sort | less` do?","lecture":4,"title":"Shell Features","topic":"Pipes","q":"What does `find . -name \"*.csv\" | sort | less` do?","a":"Recursively finds all CSV files under the current directory, sorts the list, and displays the sorted results in `less`.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does the `>` operator do in `find . -name '*.csv' > files.txt`?","lecture":4,"title":"Shell Features","topic":"Redirection","q":"What does the `>` operator do in `find . -name '*.csv' > files.txt`?","a":"Redirects stdout to `files.txt`, overwriting the file if it already exists.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:What does the `>>` operator do in `find . -name '*.py' >> files.txt`?","lecture":4,"title":"Shell Features","topic":"Redirection","q":"What does the `>>` operator do in `find . -name '*.py' >> files.txt`?","a":"Redirects stdout to `files.txt`, appending to the file instead of overwriting it.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:In the command `find / -name test 2> errors.txt`, what does `2>` do?","lecture":4,"title":"Shell Features","topic":"Redirection","q":"In the command `find / -name test 2> errors.txt`, what does `2>` do?","a":"Redirects stderr to the file `errors.txt`.","path":"lectures/04-shell_features/YSK.md"},{"id":"04-shell_features:In the command `find / -name test &> output.txt`, what does `&>` do?","lecture":4,"title":"Shell Features","topic":"Redirection","q":"In the command `find / -name test &> output.txt`, what does `&>` do?","a":"Redirects both stdout and stderr to `output.txt`.","path":"lectures/04-shell_features/YSK.md"},{"id":"05-environment:You set `name=\"Justin\"` and start a new shell with `bash`. What does `echo $name` print?","lecture":5,"title":"Environment","topic":"Environment variables","q":"You set `name=\"Justin\"` and start a new shell with `bash`. What does `echo $name` print?","a":"Nothing — shell variables are not inherited by child processes.","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:You run `export name=\"Justin\"` and start a new shell with `bash`. What does `echo $name` print?","lecture":5,"title":"Environment","topic":"Environment variables","q":"You run `export name=\"Justin\"` and start a new shell with `bash`. What does `echo $name` print?","a":"`Justin` — exported variables are inherited by child processes.","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:What command turns a shell variable into an environment variable?","lecture":5,"title":"Environment","topic":"Environment variables","q":"What command turns a shell variable into an environment variable?","a":"`export`","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:After `export NAME=\"Justin\"`, which processes inherit `$NAME`?","lecture":5,"title":"Environment","topic":"Environment variables","q":"After `export NAME=\"Justin\"`, which processes inherit `$NAME`?","a":"All descendant processes (children, grandchildren, etc.).","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:In `NAME=Justin bash`, what is the scope of `NAME`?","lecture":5,"title":"Environment","topic":"Environment variables","q":"In `NAME=Justin bash`, what is the scope of `NAME`?","a":"Only the `bash` child process, not the current shell.","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:What does `echo $NAME` print if `NAME` has never been set?","lecture":5,"title":"Environment","topic":"Environment variables","q":"What does `echo $NAME` print if `NAME` has never been set?","a":"Nothing (undefined variables expand to empty strings).","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:By convention, how should environment variable names be written?","lecture":5,"title":"Environment","topic":"Environment variables","q":"By convention, how should environment variable names be written?","a":"In all uppercase (e.g., `NAME`, `PATH`).","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:How do you access environment variable `NAME` in Python?","lecture":5,"title":"Environment","topic":"Environment variables","q":"How do you access environment variable `NAME` in Python?","a":"`os.environ['NAME']` (after `import os`).","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:In Bash, where do you define an environment variable so it persists across shell sessions?","lecture":5,"title":"Environment","topic":"Environment variables","q":"In Bash, where do you define an environment variable so it persists across shell sessions?","a":"In `~/.profile` (or `~/.bash_profile`).","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:What character separates directories in `$PATH`?","lecture":5,"title":"Environment","topic":"The PATH","q":"What character separates directories in `$PATH`?","a":"A colon (`:`).","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:If `PATH=\"/usr/local/bin:/usr/bin:/bin\"` and `ls` exists in all three directories, which copy runs when you type `ls`?","lecture":5,"title":"Environment","topic":"The PATH","q":"If `PATH=\"/usr/local/bin:/usr/bin:/bin\"` and `ls` exists in all three directories, which copy runs when you type `ls`?","a":"`/usr/local/bin/ls`","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:What does `type grep` show?","lecture":5,"title":"Environment","topic":"The PATH","q":"What does `type grep` show?","a":"The path of the executable found via `$PATH`.","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:What does `type -a grep` show?","lecture":5,"title":"Environment","topic":"The PATH","q":"What does `type -a grep` show?","a":"All matching executables for `grep` across all `$PATH` directories.","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:If `PATH=\"/usr/bin:/bin\"` and you run `export PATH=\"~/bin\"` (without including `$PATH`), what is the new value of `$PATH`?","lecture":5,"title":"Environment","topic":"The PATH","q":"If `PATH=\"/usr/bin:/bin\"` and you run `export PATH=\"~/bin\"` (without including `$PATH`), what is the new value of `$PATH`?","a":"`~/bin`","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:If `PATH=\"/usr/bin:/bin\"` and you run `export PATH=\"~/bin:$PATH\"`, what is `$PATH` now?","lecture":5,"title":"Environment","topic":"The PATH","q":"If `PATH=\"/usr/bin:/bin\"` and you run `export PATH=\"~/bin:$PATH\"`, what is `$PATH` now?","a":"`~/bin:/usr/bin:/bin`","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:Where should you put `export PATH=\"~/bin:$PATH\"` so it persists?","lecture":5,"title":"Environment","topic":"The PATH","q":"Where should you put `export PATH=\"~/bin:$PATH\"` so it persists?","a":"In `~/.profile` (or `~/.bash_profile`).","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:What happens if you run `export PATH=\"\"` (to empty the PATH) and then run `grep`?","lecture":5,"title":"Environment","topic":"The PATH","q":"What happens if you run `export PATH=\"\"` (to empty the PATH) and then run `grep`?","a":"You get a \"command not found\" error","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:What variable holds the list of directories Python searches on `import`?","lecture":5,"title":"Environment","topic":"Python's search path","q":"What variable holds the list of directories Python searches on `import`?","a":"`sys.path`.","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:What does `python -c 'import sys; print(sys.path)'` print?","lecture":5,"title":"Environment","topic":"Python's search path","q":"What does `python -c 'import sys; print(sys.path)'` print?","a":"The list of directories Python searches on `import`.","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:What is typically the first entry in `sys.path`?","lecture":5,"title":"Environment","topic":"Python's search path","q":"What is typically the first entry in `sys.path`?","a":"The directory containing the script being run.","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:How do you find where `numpy` is installed on disk?","lecture":5,"title":"Environment","topic":"Python's search path","q":"How do you find where `numpy` is installed on disk?","a":"`import numpy` and print `numpy.__path__`.","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:What does `sys.path.append('/path/to/my/packages')` do?","lecture":5,"title":"Environment","topic":"Modifying Python's search path","q":"What does `sys.path.append('/path/to/my/packages')` do?","a":"Adds a directory to Python's search path so packages there can be imported.","path":"lectures/05-environment/YSK.md"},{"id":"05-environment:Which environment variable can be modified to contain additional directories for Python to search for packages?","lecture":5,"title":"Environment","topic":"Modifying Python's search path","q":"Which environment variable can be modified to contain additional directories for Python to search for packages?","a":"`PYTHONPATH`.","path":"lectures/05-environment/YSK.md"},{"id":"06-venvs_and_agents:Why is running `sudo pip install numpy` (without a virtual environment) generally a bad idea?","lecture":6,"title":"Venvs And Agents","topic":"Python virtual environments","q":"Why is running `sudo pip install numpy` (without a virtual environment) generally a bad idea?","a":"It installs numpy globally, so all projects share the same version.","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:Where does `pip install numpy` install the package by default (without a virtual environment)?","lecture":6,"title":"Venvs And Agents","topic":"Python virtual environments","q":"Where does `pip install numpy` install the package by default (without a virtual environment)?","a":"Into the system's global Python directory","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:What problem do Python virtual environments solve?","lecture":6,"title":"Venvs And Agents","topic":"Python virtual environments","q":"What problem do Python virtual environments solve?","a":"They let each project have its own independent set of package versions.","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:What command creates a virtual environment named `myenv` in the current directory?","lecture":6,"title":"Venvs And Agents","topic":"Python virtual environments","q":"What command creates a virtual environment named `myenv` in the current directory?","a":"`python3 -m venv myenv`","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:What command activates a virtual environment located at `env/`?","lecture":6,"title":"Venvs And Agents","topic":"Python virtual environments","q":"What command activates a virtual environment located at `env/`?","a":"`source env/bin/activate` while in `env`'s parent directory.","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:What command deactivates the currently-active virtual environment?","lecture":6,"title":"Venvs And Agents","topic":"Python virtual environments","q":"What command deactivates the currently-active virtual environment?","a":"`deactivate`","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:When you activate a virtual environment, which path-related variables are modified?","lecture":6,"title":"Venvs And Agents","topic":"Python virtual environments","q":"When you activate a virtual environment, which path-related variables are modified?","a":"The shell's `$PATH` and Python's `sys.path`","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:What happens to `$PATH` and `sys.path` when you run `deactivate`?","lecture":6,"title":"Venvs And Agents","topic":"Python virtual environments","q":"What happens to `$PATH` and `sys.path` when you run `deactivate`?","a":"They are restored to their values from before activation.","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:With a virtual environment activated, what does `pip install numpy` do?","lecture":6,"title":"Venvs And Agents","topic":"Python virtual environments","q":"With a virtual environment activated, what does `pip install numpy` do?","a":"Installs numpy into the active virtual environment, not globally.","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:What command installs numpy version 1.23 specifically into the active virtual environment?","lecture":6,"title":"Venvs And Agents","topic":"Python virtual environments","q":"What command installs numpy version 1.23 specifically into the active virtual environment?","a":"`pip install numpy==1.23`","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:What is a \"prompt injection\" attack?","lecture":6,"title":"Venvs And Agents","topic":"AI agents and safety","q":"What is a \"prompt injection\" attack?","a":"Malicious instructions hidden inside otherwise innocuous data that the AI consumes and obeys.","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"06-venvs_and_agents:What command creates a Docker sandbox, installs opencode, and shares only the current directory with it?","lecture":6,"title":"Venvs And Agents","topic":"AI agents and safety","q":"What command creates a Docker sandbox, installs opencode, and shares only the current directory with it?","a":"`sbx run opencode`","path":"lectures/06-venvs_and_agents/YSK.md"},{"id":"07-git-I:What command creates a new Git repository in the current directory?","lecture":7,"title":"Git I","topic":"Git basics","q":"What command creates a new Git repository in the current directory?","a":"`git init`","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:Which command stages `README.md` for the next commit?","lecture":7,"title":"Git I","topic":"Git basics","q":"Which command stages `README.md` for the next commit?","a":"`git add README.md`","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:What does `git commit -m \"foo\"` do?","lecture":7,"title":"Git I","topic":"Git basics","q":"What does `git commit -m \"foo\"` do?","a":"Creates a new commit from the staged files with the given message.","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:What command shows the current state of files in the working tree and staging area?","lecture":7,"title":"Git I","topic":"Git basics","q":"What command shows the current state of files in the working tree and staging area?","a":"`git status`","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:What command shows the commit history of the repository?","lecture":7,"title":"Git I","topic":"Git basics","q":"What command shows the commit history of the repository?","a":"`git log`","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:What command unstages `README.md`, leaving the working tree unchanged?","lecture":7,"title":"Git I","topic":"Undoing changes","q":"What command unstages `README.md`, leaving the working tree unchanged?","a":"`git restore --staged README.md`","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:What command discards working-tree changes to `README.md` by restoring it from the staging area?","lecture":7,"title":"Git I","topic":"Undoing changes","q":"What command discards working-tree changes to `README.md` by restoring it from the staging area?","a":"`git restore README.md`","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:What command restores `README.md` in the working tree to its contents at commit `a1b2c3`?","lecture":7,"title":"Git I","topic":"Undoing changes","q":"What command restores `README.md` in the working tree to its contents at commit `a1b2c3`?","a":"`git restore --source a1b2c3 README.md`","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:What are the three \"trees\" that Git uses to track your files?","lecture":7,"title":"Git I","topic":"The three trees","q":"What are the three \"trees\" that Git uses to track your files?","a":"The working tree, the staging area, and HEAD.","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:What does the working tree contain?","lecture":7,"title":"Git I","topic":"The three trees","q":"What does the working tree contain?","a":"The actual files in your project directory.","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:What does the staging area contain?","lecture":7,"title":"Git I","topic":"The three trees","q":"What does the staging area contain?","a":"The files as they were when you last staged them.","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:What does HEAD refer to?","lecture":7,"title":"Git I","topic":"The three trees","q":"What does HEAD refer to?","a":"The files as they were in the last commit.","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:Which tree does `git add <file>` modify?","lecture":7,"title":"Git I","topic":"How commands affect the trees","q":"Which tree does `git add <file>` modify?","a":"The staging area.","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:Which tree does `git commit` modify?","lecture":7,"title":"Git I","topic":"How commands affect the trees","q":"Which tree does `git commit` modify?","a":"`HEAD`.","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:Which command copies `<file>` from HEAD into the staging area?","lecture":7,"title":"Git I","topic":"How commands affect the trees","q":"Which command copies `<file>` from HEAD into the staging area?","a":"`git restore --staged <file>`","path":"lectures/07-git-I/YSK.md"},{"id":"07-git-I:Which command copies `<file>` from the staging area into the working tree?","lecture":7,"title":"Git I","topic":"How commands affect the trees","q":"Which command copies `<file>` from the staging area into the working tree?","a":"`git restore <file>`","path":"lectures/07-git-I/YSK.md"},{"id":"08-git-II:What is the name of the single branch that every new Git repo starts with?","lecture":8,"title":"Git II","topic":"Git branches","q":"What is the name of the single branch that every new Git repo starts with?","a":"`main`","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What command creates a new branch called `alpha` and switches to it?","lecture":8,"title":"Git II","topic":"Git branches","q":"What command creates a new branch called `alpha` and switches to it?","a":"`git switch -c alpha`","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What command switches to an existing branch named `alpha`?","lecture":8,"title":"Git II","topic":"Git branches","q":"What command switches to an existing branch named `alpha`?","a":"`git switch alpha`","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:When you run `git switch alpha`, which of the three trees are updated?","lecture":8,"title":"Git II","topic":"Git branches","q":"When you run `git switch alpha`, which of the three trees are updated?","a":"All three: HEAD, the staging area, and the working tree.","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What command lists all branches in the current repo?","lecture":8,"title":"Git II","topic":"Git branches","q":"What command lists all branches in the current repo?","a":"`git branch`","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What command deletes a branch named `alpha`?","lecture":8,"title":"Git II","topic":"Git branches","q":"What command deletes a branch named `alpha`?","a":"`git branch -d alpha`","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What command merges the branch `alpha` into the current branch?","lecture":8,"title":"Git II","topic":"Merging","q":"What command merges the branch `alpha` into the current branch?","a":"`git merge alpha`","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What sequence of commands merges branch `alpha` into `main`?","lecture":8,"title":"Git II","topic":"Merging","q":"What sequence of commands merges branch `alpha` into `main`?","a":"`git switch main` followed by `git merge alpha`.","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What command aborts an in-progress merge and returns to the pre-merge state?","lecture":8,"title":"Git II","topic":"Merging","q":"What command aborts an in-progress merge and returns to the pre-merge state?","a":"`git merge --abort`","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What command merges `alpha` into the current branch, but if there are conflicts, it automatically resolves them in favor of the current branch's changes?","lecture":8,"title":"Git II","topic":"Merging","q":"What command merges `alpha` into the current branch, but if there are conflicts, it automatically resolves them in favor of the current branch's changes?","a":"`git merge -X ours alpha`","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What command merges `alpha` into the current branch, but if there are conflicts, it automatically resolves them in favor of `alpha`'s changes?","lecture":8,"title":"Git II","topic":"Merging","q":"What command merges `alpha` into the current branch, but if there are conflicts, it automatically resolves them in favor of `alpha`'s changes?","a":"`git merge -X theirs alpha`","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What command moves HEAD to a specific commit `a1b2c3` that is not associated with any branch?","lecture":8,"title":"Git II","topic":"Branch theory and detached HEAD","q":"What command moves HEAD to a specific commit `a1b2c3` that is not associated with any branch?","a":"`git switch --detach a1b2c3`","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What is a detached HEAD?","lecture":8,"title":"Git II","topic":"Branch theory and detached HEAD","q":"What is a detached HEAD?","a":"A state where HEAD points directly at a commit instead of at a branch.","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:Why is committing while in a detached HEAD state dangerous?","lecture":8,"title":"Git II","topic":"Branch theory and detached HEAD","q":"Why is committing while in a detached HEAD state dangerous?","a":"The new commits are not reachable from any branch, so they will eventually be garbage collected.","path":"lectures/08-git-II/YSK.md"},{"id":"08-git-II:What does git do with commits that are not reachable from any branch?","lecture":8,"title":"Git II","topic":"Branch theory and detached HEAD","q":"What does git do with commits that are not reachable from any branch?","a":"They are eventually garbage collected.","path":"lectures/08-git-II/YSK.md"},{"id":"09-git-III:Why is it a bad idea to commit large non-text files (e.g., PDFs, images, datasets) to a Git repo?","lecture":9,"title":"Git III","topic":"General","q":"Why is it a bad idea to commit large non-text files (e.g., PDFs, images, datasets) to a Git repo?","a":"Git stores a copy of every version of every file, so they consume lots of space and slow down operations like `git status`.","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:What is the name of the file used to tell Git which files to ignore?","lecture":9,"title":"Git III","topic":"General","q":"What is the name of the file used to tell Git which files to ignore?","a":"`.gitignore`","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:Where in the project is the `.gitignore` file usually placed?","lecture":9,"title":"Git III","topic":"General","q":"Where in the project is the `.gitignore` file usually placed?","a":"At the root of the project.","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:In a `.gitignore` file, what does the line `*.pdf` do?","lecture":9,"title":"Git III","topic":"General","q":"In a `.gitignore` file, what does the line `*.pdf` do?","a":"Tells Git to ignore all files whose names end in `.pdf`.","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:According to the recommended solo workflow, what state should the `main` branch always be in?","lecture":9,"title":"Git III","topic":"General","q":"According to the recommended solo workflow, what state should the `main` branch always be in?","a":"A \"clean\" state — e.g., the code should run without errors.","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:According to the recommended solo workflow, where should new work be done?","lecture":9,"title":"Git III","topic":"General","q":"According to the recommended solo workflow, where should new work be done?","a":"On a new feature branch, not directly on `main`.","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:What is a \"feature branch\"?","lecture":9,"title":"Git III","topic":"General","q":"What is a \"feature branch\"?","a":"A branch created for a single task, feature, or experiment, separate from `main`.","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:What does a \"squash merge\" do?","lecture":9,"title":"Git III","topic":"General","q":"What does a \"squash merge\" do?","a":"Combines all the commits from a branch into a single commit on the target branch.","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:What command performs a squash merge of the branch `feature` into the current branch?","lecture":9,"title":"Git III","topic":"General","q":"What command performs a squash merge of the branch `feature` into the current branch?","a":"`git merge --squash feature`","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:After running `git merge --squash feature`, what step is required to actually record the merge?","lecture":9,"title":"Git III","topic":"General","q":"After running `git merge --squash feature`, what step is required to actually record the merge?","a":"Run `git commit` to create the squashed commit.","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:After squash-merging a branch `feature` into `main`, what command deletes the `feature` branch?","lecture":9,"title":"Git III","topic":"General","q":"After squash-merging a branch `feature` into `main`, what command deletes the `feature` branch?","a":"`git branch -D feature`","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:In GitHub Flow, how is a feature branch merged into `main`?","lecture":9,"title":"Git III","topic":"General","q":"In GitHub Flow, how is a feature branch merged into `main`?","a":"By opening a pull request on GitHub and merging it there.","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:After committing changes to a local feature branch, what must you do before opening a pull request?","lecture":9,"title":"Git III","topic":"General","q":"After committing changes to a local feature branch, what must you do before opening a pull request?","a":"Push the branch to GitHub.","path":"lectures/09-git-III/YSK.md"},{"id":"09-git-III:What Git feature lets several AI agents work on the same repository in parallel, each on its own branch in its own directory?","lecture":9,"title":"Git III","topic":"General","q":"What Git feature lets several AI agents work on the same repository in parallel, each on its own branch in its own directory?","a":"Worktrees (`git worktree`).","path":"lectures/09-git-III/YSK.md"},{"id":"10-python_projects:What two older Python tools does `uv` replace?","lecture":10,"title":"Python Projects","topic":"uv basics","q":"What two older Python tools does `uv` replace?","a":"`pip` and `python -m venv`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:Which file does `uv init` create to hold a project's metadata and dependencies?","lecture":10,"title":"Python Projects","topic":"uv basics","q":"Which file does `uv init` create to hold a project's metadata and dependencies?","a":"`pyproject.toml`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What command adds `numpy` as a dependency to a uv project?","lecture":10,"title":"Python Projects","topic":"uv basics","q":"What command adds `numpy` as a dependency to a uv project?","a":"`uv add numpy`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What does the command `uv add \"numpy==2.4.4\"` do?","lecture":10,"title":"Python Projects","topic":"uv basics","q":"What does the command `uv add \"numpy==2.4.4\"` do?","a":"Adds numpy pinned to exactly version 2.4.4.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What command removes `numpy` from a uv project?","lecture":10,"title":"Python Projects","topic":"uv basics","q":"What command removes `numpy` from a uv project?","a":"`uv remove numpy`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What command upgrades only `numpy` to its latest allowed version?","lecture":10,"title":"Python Projects","topic":"uv basics","q":"What command upgrades only `numpy` to its latest allowed version?","a":"`uv lock --upgrade-package numpy`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What command upgrades all dependencies in a uv project to their latest allowed versions?","lecture":10,"title":"Python Projects","topic":"uv basics","q":"What command upgrades all dependencies in a uv project to their latest allowed versions?","a":"`uv lock --upgrade`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What command activates a uv project's virtual environment in a bash shell?","lecture":10,"title":"Python Projects","topic":"Virtual environments and uv run","q":"What command activates a uv project's virtual environment in a bash shell?","a":"`source .venv/bin/activate`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What does `uv run pytest` do?","lecture":10,"title":"Python Projects","topic":"Virtual environments and uv run","q":"What does `uv run pytest` do?","a":"Runs `pytest` inside the project's virtual environment.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What does `uvx ruff` do?","lecture":10,"title":"Python Projects","topic":"Virtual environments and uv run","q":"What does `uvx ruff` do?","a":"Installs and runs `ruff` outside of a project.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What does `uv sync` do?","lecture":10,"title":"Python Projects","topic":"Declarative dependency management","q":"What does `uv sync` do?","a":"Updates the virtual environment to match the dependencies declared in `pyproject.toml` and `uv.lock`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What is the purpose of the `uv.lock` file?","lecture":10,"title":"Python Projects","topic":"Declarative dependency management","q":"What is the purpose of the `uv.lock` file?","a":"It records the exact version of every installed package (and every recursive dependency) so the environment can be reproduced.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:After cloning a uv project from GitHub, what single command sets up an identical virtual environment?","lecture":10,"title":"Python Projects","topic":"Declarative dependency management","q":"After cloning a uv project from GitHub, what single command sets up an identical virtual environment?","a":"`uv sync`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What is a \"dev dependency\"?","lecture":10,"title":"Python Projects","topic":"Dev dependencies","q":"What is a \"dev dependency\"?","a":"A package needed only during development (e.g., a linter or test runner), not at runtime.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What command adds `ruff` as a dev dependency?","lecture":10,"title":"Python Projects","topic":"Dev dependencies","q":"What command adds `ruff` as a dev dependency?","a":"`uv add --dev ruff`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What does a *linter* do?","lecture":10,"title":"Python Projects","topic":"Dev tools: linters, formatters, type checkers, tests","q":"What does a *linter* do?","a":"Checks code for potential errors and style issues.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What command uses ruff to check `main.py` for lint errors?","lecture":10,"title":"Python Projects","topic":"Dev tools: linters, formatters, type checkers, tests","q":"What command uses ruff to check `main.py` for lint errors?","a":"`ruff check main.py`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What command uses ruff to automatically fix the lint errors it finds in `main.py`?","lecture":10,"title":"Python Projects","topic":"Dev tools: linters, formatters, type checkers, tests","q":"What command uses ruff to automatically fix the lint errors it finds in `main.py`?","a":"`ruff check --fix main.py`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What command uses ruff to reformat `main.py` according to its style rules?","lecture":10,"title":"Python Projects","topic":"Dev tools: linters, formatters, type checkers, tests","q":"What command uses ruff to reformat `main.py` according to its style rules?","a":"`ruff format main.py`.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:What is PEP8?","lecture":10,"title":"Python Projects","topic":"Dev tools: linters, formatters, type checkers, tests","q":"What is PEP8?","a":"The official Python style guide.","path":"lectures/10-python_projects/YSK.md"},{"id":"10-python_projects:According to PEP8, what naming convention should be used for variable and function names?","lecture":10,"title":"Python Projects","topic":"Dev tools: linters, formatters, type checkers, tests","q":"According to PEP8, what naming convention should be used for variable and function names?","a":"`snake_case`.","path":"lectures/10-python_projects/YSK.md"}];
const BUILT='2026-10-30',KEY='dsc190-study-v1',UI_KEY='dsc190-ui-v1',MODES=['cards','practice','wrong','all'];
const $=s=>document.querySelector(s),source='dsc-courses/dsc190-tools-2026-fa',repo='https://api.github.com/repos/'+source,raw='https://raw.githubusercontent.com/'+source+'/main/';
// Lectures are grouped two per quiz. If the course schedule differs, map a lecture to its quiz here, e.g. {7:3}.
const QUIZ_OVERRIDES={},QUIZ_TITLES={1:'The Unix Shell'};
const quizOf=n=>QUIZ_OVERRIDES[n]??Math.max(1,Math.ceil(n/2));
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>escape(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const plain=s=>String(s).replace(/`/g,'');
const pad=n=>String(n).padStart(2,'0');
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{return{}}}
// A synced bank is used only when it is at least as new as the questions built into this page.
// Older saves (before the `synced` flag) stored the built-in bank too; only a later date marks a real sync.
function syncedBank(s){return Array.isArray(s.data)&&s.data.length&&(s.synced||(s.updated&&s.updated!==BUILT))&&s.updated>=BUILT?s.data:null}
let saved=load(),bank=syncedBank(saved);
let data=bank||INITIAL,synced=!!bank,updated=bank?saved.updated:BUILT,progress=saved.progress||{};
let quiz=1,mode='cards',index=0,flipped=false,round=null,score=0,attempts=0,order=[],finished=false,notice='',spoken='';
let ui={};try{ui=JSON.parse(localStorage.getItem(UI_KEY)||'{}')||{}}catch{}
function write(patch){try{let s={...load(),...patch};if(!syncedBank(s)){delete s.data;delete s.synced;delete s.updated}localStorage.setItem(KEY,JSON.stringify(s));return true}catch{$('#status').textContent='Progress could not be saved in this browser.';return false}}
// Re-read storage before each change so another open tab's marks are never overwritten.
function setProgress(id,state){let p={...(load().progress||progress)};if(state)p[id]=state;else delete p[id];progress=p;write({progress:p})}
function saveUI(){try{localStorage.setItem(UI_KEY,JSON.stringify({quiz,mode,index,lecture:$('#lecture').value,topic:$('#topic').value,type:$('#type').value}))}catch{}}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const announce=msg=>{$('#announce').textContent=msg};
// On short screens, keep the card's buttons on screen after each step instead of making people scroll for them.
function keepInView(){let a=$('#surface .actions');if(!a)return;let r=a.getBoundingClientRect();if(r.bottom>innerHeight)scrollBy(0,Math.max(0,Math.min(r.bottom-innerHeight+12,$('#surface .card').getBoundingClientRect().top-8)))}
function quizList(){return[...new Set(data.map(q=>quizOf(q.lecture)))].sort((a,b)=>a-b)}
function quizData(n=quiz){return data.filter(q=>quizOf(q.lecture)===n)}
function lectureRange(ls){ls=[...new Set(ls)].sort((a,b)=>a-b);return ls.length>1?`Lecture ${ls[0]}–${ls[ls.length-1]}`:`Lecture ${ls[0]}`}
function filtered(){return quizData().filter(q=>(!$('#lecture').value||q.lecture==$('#lecture').value)&&(!$('#topic').value||q.topic==$('#topic').value))}
function pool(){let qs=filtered();if(mode==='wrong')return qs.filter(q=>progress[q.id]==='wrong');if(mode==='practice'){let rank=new Map(order.map((id,i)=>[id,i]));return qs.filter(q=>reviewedOptions(q)).sort((a,b)=>(rank.get(a.id)??1e9)-(rank.get(b.id)??1e9))}return qs}
function reset(){index=0;flipped=false;round=null;score=0;attempts=0;finished=false;notice='';order=mode==='practice'?shuffle(filtered().map(q=>q.id)):[];render()}
function setTabs(){document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-current',b.dataset.mode===mode?'page':'false')})}
function setMode(m){if(m===mode&&!finished)return;mode=m;setTabs();reset()}
function setup(){let quizzes=quizList();$('#quizzes').innerHTML=quizzes.map(n=>`<button id="quiz-${n}" class="quiz ${n===quiz?'active':''}" data-quiz="${n}" aria-current="${n===quiz?'page':'false'}"><span class="quiz-copy"><b>Quiz ${pad(n)}</b><small>${lectureRange(quizData(n).map(q=>q.lecture))}</small></span><span class="quiz-count">${quizData(n).length}</span></button>`).join('');document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{if(+b.dataset.quiz===quiz)return;quiz=+b.dataset.quiz;setup();reset();$('#quiz-'+quiz)?.focus({preventScroll:true})});let next=quizzes[quizzes.length-1]+1,max=Math.max(...data.map(q=>q.lecture)),upcoming=[];for(let n=max+1;n<=max+6;n++)if(quizOf(n)===next)upcoming.push(n);$('#soon').innerHTML=`<span class="quiz-copy"><b>Quiz ${pad(next)}</b><small>${upcoming.length?lectureRange(upcoming):'Coming up'}</small></span><span class="quiz-count">—</span>`;let titles=[...new Set(quizData().map(q=>q.title))];$('#heading').textContent=`Quiz ${pad(quiz)} · ${QUIZ_TITLES[quiz]||titles.join(' & ')}`;$('#intro').textContent=lectureRange(quizData().map(q=>q.lecture));$('#lecture').innerHTML='<option value="">All lectures</option>'+[...new Set(quizData().map(q=>q.lecture))].sort((a,b)=>a-b).map(n=>`<option value="${n}">Lecture ${pad(n)} · ${escape(quizData().find(q=>q.lecture===n).title)}</option>`).join('');topics();$('#sync').title=synced?`Last synced ${updated}`:`Using the questions built into this page (${BUILT})`}
function topics(){$('#topic').innerHTML='<option value="">All topics</option>'+[...new Set(quizData().filter(q=>!$('#lecture').value||q.lecture==$('#lecture').value).map(q=>q.topic))].map(t=>`<option value="${escape(t)}">${escape(t.replace(/`/g,'').replace(/^The /,''))}</option>`).join('')}
function stats(){let qs=quizData();$('#total').textContent=qs.length;$('#known').textContent=qs.filter(q=>progress[q.id]==='known').length;$('#missed').textContent=qs.filter(q=>progress[q.id]==='wrong').length}
