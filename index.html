const $=s=>document.querySelector(s),repo='https://api.github.com/repos/dsc-courses/dsc190-tools-2026-fa';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>escape(s).replace(/`([^`]+)`/g,'<code>$1</code>');
let saved={};try{saved=JSON.parse(localStorage.getItem('dsc190-study-v1')||'{}')}catch{}
let data=Array.isArray(saved.data)&&saved.data.length?saved.data:INITIAL,progress=saved.progress||{},updated=saved.updated||'2026-09-24',quiz=1,mode='cards',index=0,flipped=false,round=null,score=0,attempts=0;
function save(){try{localStorage.setItem('dsc190-study-v1',JSON.stringify({data,progress,updated}))}catch{$('#status').textContent='Progress could not be saved.'}}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function quizData(){return data.filter(q=>Math.ceil(q.lecture/2)===quiz)}
function pool(){return quizData().filter(q=>(!$('#lecture').value||q.lecture==$('#lecture').value)&&(!$('#topic').value||q.topic==$('#topic').value)&&(mode!=='wrong'||progress[q.id]==='wrong'))}
function reset(){index=0;flipped=false;round=null;score=0;attempts=0;render()}
function setup(){let quizzes=[...new Set(data.map(q=>Math.ceil(q.lecture/2)))].sort((a,b)=>a-b);$('#quizzes').innerHTML=quizzes.map(n=>`<button class="quiz ${n===quiz?'active':''}" data-quiz="${n}"><span class="quiz-copy"><b>Quiz ${String(n).padStart(2,'0')}</b><small>Lecture ${n*2-1}–${n*2}</small></span><span class="quiz-count">${data.filter(q=>Math.ceil(q.lecture/2)===n).length}</span></button>`).join('');document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{quiz=+b.dataset.quiz;setup();reset()});let next=quizzes[quizzes.length-1]+1;$('#soon').innerHTML=`<span class="quiz-copy"><b>Quiz ${String(next).padStart(2,'0')}</b><small>Lecture ${next*2-1}–${next*2}</small></span><span class="quiz-count">—</span>`;$('#heading').textContent=`Quiz ${String(quiz).padStart(2,'0')} · ${quiz===1?'The Unix Shell':'YSK Review'}`;$('#intro').textContent=`Lecture ${quiz*2-1}–${quiz*2}`;$('#lecture').innerHTML='<option value="">All lectures</option>'+[...new Set(quizData().map(q=>q.lecture))].map(n=>`<option value="${n}">Lecture ${String(n).padStart(2,'0')} · ${escape(quizData().find(q=>q.lecture===n).title)}</option>`).join('');topics();$('#sync').title=`Last synced ${updated}`}
function topics(){$('#topic').innerHTML='<option value="">All topics</option>'+[...new Set(quizData().filter(q=>!$('#lecture').value||q.lecture==$('#lecture').value).map(q=>q.topic))].map(t=>`<option value="${escape(t)}">${escape(t.replace(/`/g,'').replace(/^The /,''))}</option>`).join('')}
function stats(){let qs=quizData();$('#total').textContent=qs.length;$('#known').textContent=qs.filter(q=>progress[q.id]==='known').length;$('#missed').textContent=qs.filter(q=>progress[q.id]==='wrong').length}
function makeRound(q){let alternatives=shuffle([...new Set(data.map(x=>x.a))].filter(a=>a!==q.a&&!((/home directory/.test(q.a))&&/home directory/.test(a))&&!(/^removes/.test(q.a)&&/^removes/.test(a))));let type=$('#type').value;if(type==='mixed')type=Math.random()<.5?'mc':'tf';if(type==='tf'){let truth=Math.random()<.5;return{type,proposed:truth?q.a:alternatives[0],options:['True','False'],correct:truth?0:1,selected:null}}let options=shuffle([q.a,...alternatives.slice(0,3)]);return{type,options,correct:options.indexOf(q.a),selected:null}}
function render(){stats();let qs=pool();if(index>=qs.length)index=0;$('#type').hidden=mode!=='practice';$('#counter').textContent=qs.length?`${index+1} / ${qs.length}`:'0 / 0';if(!qs.length){$('#surface').innerHTML='<div class="card empty"><h2>Nothing to review.</h2></div>';return}if(mode==='all'){$('#counter').textContent=`${qs.length} questions`;$('#surface').innerHTML=qs.map(q=>`<details class="list-item"><summary>${fmt(q.q)}</summary><p>${fmt(q.a)}</p><span class="hint">Lecture ${q.lecture} · ${fmt(q.topic)}</span></details>`).join('');return}let q=qs[index],top=`<div class="card-top"><span class="tag">Lecture ${q.lecture} · ${fmt(q.topic.replace(/^The /,''))}</span><a href="https://github.com/dsc-courses/dsc190-tools-2026-fa/blob/main/${q.path}" target="_blank" rel="noopener" class="hint">Source ↗</a></div>`;let content='';if(mode==='practice'){if(!round)round=makeRound(q);content=`${round.type==='tf'?`<p class="hint">True / False</p>`:''}<h2 class="question">${fmt(q.q)}</h2>${round.type==='tf'?`<div class="answer" style="margin-bottom:20px">${fmt(round.proposed)}</div>`:''}<div class="options">${round.options.map((o,i)=>`<button class="option ${round.selected!==null?(i===round.correct?'correct':i===round.selected?'wrong':''):''}" data-choice="${i}" ${round.selected!==null?'disabled':''}>${round.type==='mc'?String.fromCharCode(65+i)+'. ':''}${fmt(o)}</button>`).join('')}</div><div class="feedback" role="status">${round.selected===null?'':`${round.selected===round.correct?'Correct':'Incorrect'}<br>Answer: ${fmt(q.a)}`}</div>`}else{content=`<h2 class="question">${fmt(q.q)}</h2>${flipped?`<div class="answer">${fmt(q.a)}</div>`:''}`}
$('#surface').innerHTML=`<div class="progress"><i style="width:${(index+1)/qs.length*100}%"></i></div><section class="card">${top}${content}</section><div class="actions">${mode==='practice'?`<span class="hint" style="padding:12px">${score} / ${attempts} correct</span><button id="next" class="primary" ${round.selected===null?'disabled':''}>${index===qs.length-1?'Finish':'Next →'}</button>`:`<button id="prev" aria-label="Previous question">← Previous</button><button id="flip" class="${flipped?'quiet':'primary'}">${flipped?'Hide answer':'Show answer'}</button><button id="next" aria-label="Next question">Next →</button>${flipped?'<button id="again">Review again</button><button id="master">Knew it</button>':''}`}</div>`;
if($('#flip'))$('#flip').onclick=()=>{flipped=!flipped;render()};if($('#prev'))$('#prev').onclick=()=>{index=(index-1+qs.length)%qs.length;flipped=false;round=null;render()};$('#next').onclick=()=>{if(mode==='practice'&&index===qs.length-1){$('#surface').innerHTML=`<div class="card empty"><p class="eyebrow">SESSION COMPLETE</p><h2>${score} / ${attempts} correct</h2><div class="actions"><button id="restart" class="primary">Try again</button><button id="review">Review missed</button></div></div>`;$('#restart').onclick=reset;$('#review').onclick=()=>setMode('wrong');return}index=(index+1)%qs.length;flipped=false;round=null;render()};for(let [id,state] of [['again','wrong'],['master','known']])if($('#'+id))$('#'+id).onclick=()=>{progress[q.id]=state;save();if(mode!=='wrong')index=(index+1)%qs.length;else if(state==='wrong')index=(index+1)%qs.length;flipped=false;round=null;render()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(round.selected!==null)return;round.selected=+b.dataset.choice;attempts++;if(round.selected===round.correct){score++;progress[q.id]='known'}else progress[q.id]='wrong';save();render()})}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===m);b.setAttribute('aria-current',b.dataset.mode===m?'page':'false')});reset()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#lecture').onchange=()=>{topics();reset()};$('#topic').onchange=reset;$('#type').onchange=reset;
function parseYSK(text,path){let n=+path.match(/lectures\/(\d+)/)[1],title=path.split('/')[1].replace(/^\d+-/,'').replace(/[_-]/g,' '),topic='General',q=null,out=[];for(let line of text.split(/\r?\n/)){if(/^#{1,6} /.test(line))topic=line.replace(/^#+ /,'');else if(/^- /.test(line)){if(q)throw Error(path+': missing answer');q=line.slice(2).trim()}else if(line.includes('**Answer**:')&&q){out.push({id:path.split('/')[1]+':'+q,lecture:n,title,topic,q,a:line.split('**Answer**:')[1].trim(),path});q=null}}if(q||!out.length||out.some(q=>!q.a))throw Error(path+': unsupported question format');return out}
async function getJSON(url){let r=await fetch(url,{signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error(`GitHub HTTP ${r.status}`);return r.json()}
$('#sync').onclick=async()=>{let b=$('#sync');b.disabled=true;$('#status').textContent='Syncing…';try{let tree=await getJSON(repo+'/git/trees/main?recursive=1');if(tree.truncated)throw Error('Incomplete file list');let files=tree.tree.filter(x=>/^lectures\/\d+[^/]*\/YSK\.md$/.test(x.path));if(!files.length)throw Error('No questions found');let fresh=[];for(let f of files){let blob=await getJSON(repo+'/git/blobs/'+f.sha);let bytes=Uint8Array.from(atob(blob.content.replace(/\s/g,'')),c=>c.charCodeAt(0));fresh.push(...parseYSK(new TextDecoder().decode(bytes),f.path))}let added=fresh.filter(q=>!data.some(old=>old.id===q.id)).length;data=fresh;updated=new Date().toLocaleDateString('sv-SE');save();if(!quizData().length)quiz=Math.ceil(data[0].lecture/2);setup();reset();$('#status').textContent=`${added ? `${added} new questions` : 'Up to date'}`}catch(e){$('#status').textContent=`Sync failed. ${e.message}.`}finally{b.disabled=false}};

const oldRender=render;
render=function(){oldRender();document.querySelector('.content').classList.toggle('practice-view',mode==='practice');const card=document.querySelector('.card');if(card){const cat=document.createElement('img');cat.className='cat';cat.alt='';cat.src=CATS[mode==='practice'||!pool().length?'sleep':flipped?'up':'idle'];card.append(cat);const flip=$('#flip');if(flip&&!flipped){flip.classList.add('reveal-in-card');card.append(flip)}if(mode!=='practice'&&!card.classList.contains('empty')){const zone=document.createElement('div');zone.className='answer-zone';const answer=card.querySelector('.answer');const hint=card.querySelector('p.hint');if(answer)zone.append(answer);if(hint)zone.append(hint);if(flip&&!flipped)zone.append(flip);card.append(zone)}}const bar=document.querySelector('.progress');if(bar){bar.innerHTML='';let last=null;pool().forEach((q,i)=>{if(q.lecture!==last){let label=document.createElement('span');label.className='lecture-mark';label.textContent='L'+q.lecture;bar.append(label);last=q.lecture}let dot=document.createElement('button');dot.className='bead '+(progress[q.id]||'')+(i===index?' current':'');dot.setAttribute('aria-label','Question '+(i+1)+(progress[q.id]==='known'?', known':progress[q.id]==='wrong'?', review':''));dot.title='Question '+(i+1);dot.disabled=mode==='practice';dot.onclick=()=>{index=i;flipped=false;round=null;render()};bar.append(dot)})}};
document.addEventListener('keydown',event=>{if(event.ctrlKey||event.metaKey||event.altKey||['INPUT','SELECT','TEXTAREA','BUTTON','A','SUMMARY'].includes(event.target.tagName))return;let id=event.code==='Space'?'flip':event.key==='ArrowLeft'?'prev':event.key==='ArrowRight'?'next':event.key==='1'?'master':event.key==='2'?'again':null;if(id&&$('#'+id)&&!$('#'+id).disabled){event.preventDefault();$('#'+id).click()}});
setup();const viewParams=new URLSearchParams(location.search);if(viewParams.has('card'))index=Math.max(0,Math.min(pool().length-1,Number(viewParams.get('card'))-1||0));flipped=viewParams.get('answer')==='shown';render();
</script></body></html>
