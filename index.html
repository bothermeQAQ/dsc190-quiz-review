const REVIEWED_OPTIONS=[{"reference":"1.1","lecture":1,"path":"lectures/01-intro/YSK.md","question":"What does the `-a` flag do in the `ls` command?","answer":"shows all files, including hidden files (starting with a dot)","tricky":["shows hidden files only, excluding ordinary files","shows all ordinary files with their permissions and owners, but omits hidden files"],"obvious":"creates a new empty directory"},{"reference":"1.2","lecture":1,"path":"lectures/01-intro/YSK.md","question":"What does the `-l` flag do in the `ls` command?","answer":"shows files in long format (permissions, owner, size, date, name)","tricky":["shows file names one per line without permissions, owners, sizes, or dates","shows files sorted by size instead of showing their metadata"],"obvious":"changes the current working directory"},{"reference":"1.3","lecture":1,"path":"lectures/01-intro/YSK.md","question":"What does the `-r` flag do in the `rm` command?","answer":"removes directories and their contents recursively","tricky":["removes files in reverse alphabetical order without entering directories","removes a directory only when it is already empty"],"obvious":"renames a file instead of deleting it"},{"reference":"2.1","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `rm foo/` do if foo is a directory?","answer":"prints an error because `rm` by default only removes files, not directories","tricky":["removes foo only if it is empty, even without a recursive flag","removes foo and its contents because the trailing slash enables recursion"],"obvious":"opens foo in a text editor"},{"reference":"2.2","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `rm -r` do?","answer":"removes a directory and everything inside it recursively","tricky":["removes a directory only after all its contents have been deleted separately","removes files only from the top level and leaves nested directories in place"],"obvious":"prints the current working directory"},{"reference":"2.3","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `rm -rf` do?","answer":"removes recursively and forcefully, without prompting for confirmation","tricky":["removes recursively, but the f flag requires confirmation for every deletion","forcefully removes ordinary files but leaves all subdirectories untouched"],"obvious":"restores files that were previously deleted"},{"reference":"2.4","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `mkdir` do?","answer":"creates a new directory","tricky":["creates an empty regular file with the specified name","changes into an existing directory without creating anything"],"obvious":"prints a file one screen at a time"},{"reference":"2.5","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `mv` do?","answer":"moves a file or directory to a new location","tricky":["copies a file or directory while always keeping the original in place","changes a file name but cannot move a file to a different directory"],"obvious":"displays the manual page for a command"},{"reference":"2.6","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What command is used to rename a single file?","answer":"`mv <old-name> <new-name>`","tricky":["`cp <old-name> <new-name>` — this renames the original without keeping a second copy","`mv <new-name> <old-name>` — the new name goes first and the existing name goes second"],"obvious":"`pwd <old-name> <new-name>`"},{"reference":"2.7","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `cp` do?","answer":"copies a file to a new location","tricky":["moves a file to a new location and removes the original","copies a directory and all its contents by default, without a recursive flag"],"obvious":"changes into your home directory"},{"reference":"2.8","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does the `-r` flag do in the `cp` command?","answer":"copies directories and their contents recursively","tricky":["reverses the source and destination of the copy","copies only the directory entry, excluding everything inside it"],"obvious":"displays the shell command history"},{"reference":"2.9","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `cp -r foo/ ~` do?","answer":"copies the `foo/` directory and everything inside it to your home directory","tricky":["copies only the contents of foo directly into your home directory, without a foo directory","moves foo into your home directory and deletes the original foo"],"obvious":"deletes all CSV files in foo"},{"reference":"2.10","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `less` do?","answer":"opens a file for viewing one screen at a time","tricky":["opens a file for editing and saves changes when you quit","prints only the last screen of a file and cannot scroll backward"],"obvious":"creates a Python virtual environment"},{"reference":"2.11","lecture":2,"path":"lectures/02-shell/YSK.md","question":"How do you scroll down by one line in `less`?","answer":"down arrow key or `j`.","tricky":["up arrow key or `k`","`Ctrl-D`, which moves down half a page rather than exactly one line"],"obvious":"`mkdir`"},{"reference":"2.12","lecture":2,"path":"lectures/02-shell/YSK.md","question":"How do you scroll up by one line in `less`?","answer":"up arrow key or `k`.","tricky":["down arrow key or `j`","`Ctrl-U`, which moves up half a page rather than exactly one line"],"obvious":"`pwd`"},{"reference":"2.13","lecture":2,"path":"lectures/02-shell/YSK.md","question":"How do you scroll down by one-half page in `less`?","answer":"`<ctrl-d>`","tricky":["`Ctrl-U`","`j`, which moves down one line rather than half a page"],"obvious":"`mkdir`"},{"reference":"2.14","lecture":2,"path":"lectures/02-shell/YSK.md","question":"How do you scroll up by one-half page in `less`?","answer":"`<ctrl-u>`","tricky":["`Ctrl-D`","`k`, which moves up one line rather than half a page"],"obvious":"`pwd`"},{"reference":"2.15","lecture":2,"path":"lectures/02-shell/YSK.md","question":"How do you jump to the end of a file in `less`?","answer":"press `G`","tricky":["press lowercase `g`","press `j` once to move directly to the last line"],"obvious":"run `mkdir`"},{"reference":"2.16","lecture":2,"path":"lectures/02-shell/YSK.md","question":"How do you search for text in `less`?","answer":"press `/` then type your search term","tricky":["press `n` and type a new term, without starting a search with `/`","press `G` and type the term to start a text search"],"obvious":"run `cp` to start searching"},{"reference":"2.17","lecture":2,"path":"lectures/02-shell/YSK.md","question":"How do you quit `less`?","answer":"press `q`","tricky":["press Escape once to exit the viewer","press `Ctrl-U` to close the file"],"obvious":"run `mkdir`"},{"reference":"2.18","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does the `man` command do?","answer":"displays the manual page for a command","tricky":["runs a command in a mode that prints only usage examples, without opening a manual","prints the location of a command executable instead of its documentation"],"obvious":"renames the current directory"},{"reference":"2.19","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does the `pwd` command do?","answer":"prints the current working directory","tricky":["prints the directory you were in before the current one","prints the list of directories searched for executable commands"],"obvious":"creates a copy of the current directory"},{"reference":"2.20","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `cd` do if we don't give it any arguments?","answer":"changes to your home directory","tricky":["stays in the current directory until a directory argument is supplied","changes to the previous directory, as with `cd -`"],"obvious":"deletes your home directory"},{"reference":"2.21","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `cd -` do?","answer":"changes to the previous directory you were in","tricky":["changes to the parent of the current directory","changes to the home directory regardless of where you were before"],"obvious":"copies the current directory to a backup"},{"reference":"2.22","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `cd ..` do?","answer":"moves up one directory level","tricky":["changes to the directory you visited immediately before the current one","always changes to the home directory"],"obvious":"lists all hidden files"},{"reference":"2.23","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `cd ~` do?","answer":"changes to your home directory","tricky":["changes to the parent of the current directory","changes to the previous directory you visited"],"obvious":"removes the current directory"},{"reference":"2.24","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does pressing the up arrow key do at the command line?","answer":"cycles through previous commands in your history","tricky":["executes the previous command immediately, without waiting for Enter","moves the text cursor to the start of the current command rather than selecting history"],"obvious":"creates an empty directory"},{"reference":"2.25","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `<Alt-left arrow>` do at the command line? (Option-left arrow on Mac)","answer":"moves the cursor one word to the left","tricky":["moves the cursor one character to the left","deletes the word before the cursor"],"obvious":"prints the shell manual"},{"reference":"2.26","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `<Alt-right arrow>` do at the command line? (Option-right arrow on Mac)","answer":"moves the cursor one word to the right","tricky":["moves the cursor one character to the right","moves the cursor directly to the end of the line"],"obvious":"creates a directory"},{"reference":"2.27","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `<Ctrl-u>` do at the command line?","answer":"deletes everything from the cursor to the beginning of the line","tricky":["deletes everything from the cursor to the end of the line","deletes only the word immediately before the cursor"],"obvious":"changes into the home directory"},{"reference":"2.28","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `<Ctrl-a>` do at the command line?","answer":"moves the cursor to the beginning of the line","tricky":["moves the cursor to the end of the line","deletes the text from the cursor to the beginning of the line"],"obvious":"copies the current file"},{"reference":"2.29","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `<Ctrl-e>` do at the command line?","answer":"moves the cursor to the end of the line","tricky":["moves the cursor to the beginning of the line","deletes everything from the cursor to the end of the line"],"obvious":"prints the current directory"},{"reference":"2.30","lecture":2,"path":"lectures/02-shell/YSK.md","question":"What does `<Ctrl-w>` do at the command line?","answer":"deletes the word before the cursor","tricky":["deletes everything from the cursor to the beginning of the line","moves the cursor one word to the left without deleting anything"],"obvious":"creates a backup directory"},{"reference":"3.1","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What is an AI agent?","answer":"An LLM that can call tools in a loop.","tricky":["An LLM that can request a tool once but is required to stop after that tool returns","A fixed sequence of tool calls in which an LLM cannot choose the next action"],"obvious":"A command that prints the current working directory"},{"reference":"3.2","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `find . -name '*.csv'` do?","answer":"recursively searches for anything with a name that ends in \".csv\" under the current directory","tricky":["searches only the current directory, without looking in subdirectories","searches the contents of files for the text .csv rather than matching their names"],"obvious":"renames every file to .csv"},{"reference":"3.3","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `find foo/ -name 'bar'` do?","answer":"recursively searches for things named \"bar\" (exactly) under the directory \"foo\"","tricky":["finds every name containing bar anywhere in it under foo","finds exact matches for bar only at the top level of foo"],"obvious":"creates a new file named bar in foo"},{"reference":"3.4","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"Your current directory contains a file named \"test_backend.py\". Will `find . -name 'test'` match it?","answer":"No, it only matches things named exactly \"test\"","tricky":["Yes, because -name implicitly adds wildcards before and after test","Yes, because -name searches file contents as well as file names"],"obvious":"Yes, because find renames test_backend.py to test first"},{"reference":"3.5","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What is the difference between `-name` and `-iname` in the `find` command?","answer":"`-iname` is case-insensitive, while `-name` is case-sensitive.","tricky":["-name ignores case, while -iname requires the same capitalization","-iname searches file contents, while -name searches file names"],"obvious":"-iname installs a new shell"},{"reference":"3.6","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `find . -type d -name 'data*'` do?","answer":"Finds directories (not files) whose names start with \"data\".","tricky":["finds only regular files whose names start with data","finds directories whose names contain data at any position, not just the start"],"obvious":"deletes every directory whose name starts with data"},{"reference":"3.7","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `find . -name 'test' -maxdepth 1` do?","answer":"Finds things named \"test\" in the current directory, but does not search subdirectories.","tricky":["finds test inside immediate subdirectories as well as in the current directory","searches all nested directories and stops after the first matching test"],"obvious":"renames the current directory to test"},{"reference":"3.8","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `find . -name '*.csv' -exec rm {} \\;` do?","answer":"deletes all CSVs under the current directory and its subdirectories","tricky":["deletes matching CSVs only at the top level, leaving subdirectories unsearched","prints the matching CSV paths but does not execute rm"],"obvious":"converts every CSV into a Python script"},{"reference":"3.9","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"In `find . -name '*.csv' -exec rm {} \\;`, what does `{}` represent?","answer":"a placeholder that gets replaced with the path of each found file","tricky":["a placeholder for the starting search directory, unchanged for every result","a placeholder for the file contents rather than the matched path"],"obvious":"a command that activates a virtual environment"},{"reference":"3.10","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `find . -type f -name '*.py' -exec grep 'foo' {} \\;` do?","answer":"Prints every line containing \"foo\" in every `.py` file in this directory and its subdirectories.","tricky":["prints every line containing foo in every file, ignoring the .py restriction","prints the names of matching .py files but never prints their matching lines"],"obvious":"replaces foo with bar in every Python file"},{"reference":"3.11","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `grep foo bar` do?","answer":"searches for the string \"foo\" in the file \"bar\" and prints matching lines","tricky":["searches for the string bar inside the file foo","searches for files named foo under the directory bar recursively"],"obvious":"renames bar to foo"},{"reference":"3.12","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `grep foo .` do?","answer":"Prints an error, because without `-r`, grep expects a file, not a directory.","tricky":["recursively searches all files beneath the current directory automatically","lists file names containing foo instead of searching file contents"],"obvious":"changes the current working directory to foo"},{"reference":"3.13","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `grep -r foo bar` do?","answer":"searches for the string \"foo\" in all files under the directory \"bar\" recursively","tricky":["searches only a single regular file named bar and never enters a directory","searches bar recursively and ignores differences in letter case"],"obvious":"deletes all matching files under bar"},{"reference":"3.14","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `grep -ri foo bar` do?","answer":"searches for the string \"foo\" in all files under the directory \"bar\" recursively, ignoring case","tricky":["searches recursively but matches foo only with the same capitalization","ignores case but searches only the top-level files of bar"],"obvious":"renames the directory bar to foo"},{"reference":"3.15","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"What does `grep -n foo bar` do?","answer":"searches for the string \"foo\" in the file \"bar\" and prints matching lines, prefixed with their line number","tricky":["prints only the total number of matching lines, without showing the lines","prints matching lines prefixed with byte offsets instead of line numbers"],"obvious":"changes the file name from bar to foo"},{"reference":"3.16","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"The file `file.txt` contains the line \"One foo bar two\". Will `grep 'foo' file.txt` return (match) that line?","answer":"Yes, it matches because \"foo\" is a substring of \"One foo bar two\"","tricky":["No, because grep requires the entire line to be exactly foo","No, because grep matches only when foo is the first word of the line"],"obvious":"No, because grep searches only directory names"},{"reference":"3.17","lecture":3,"path":"lectures/03-finding_and_editing/YSK.md","question":"The file `file.txt` contains the line \"ONE FOO BAR TWO\". Will `grep 'foo' file.txt` return (match) that line?","answer":"No, it does not match because grep is case-sensitive","tricky":["Yes, because grep ignores letter case by default","Yes, because single quotes make the pattern case-insensitive"],"obvious":"Yes, because grep converts the entire file to lowercase on disk"},{"reference":"4.1","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"How do you quit VIM?","answer":"Hit the escape key, type `:q` and press Enter.","tricky":["Hit Escape, type `:w`, and press Enter; this saves and exits in one step","Stay in insert mode, type `:q`, and press Enter without pressing Escape"],"obvious":"Run `mkdir` inside the text being edited"},{"reference":"4.2","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does the `nano` command do?","answer":"Opens a simple text editor in the terminal.","tricky":["opens a terminal file viewer that cannot edit the file","creates a blank file and immediately exits instead of opening an editor"],"obvious":"activates a Python virtual environment"},{"reference":"4.3","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"In nano, the bottom toolbar shows a shortcut like `^X Exit`. What key combination does `^X` refer to?","answer":"Ctrl-X.","tricky":["Shift-X","Alt-X"],"obvious":"Press the Up and Down arrow keys together"},{"reference":"4.4","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"A directory contains the files `data_01.txt`, `data_02.txt`, and `data.txt`. If we run `rm data???.txt`, which files will be deleted?","answer":"`data_01.txt` and `data_02.txt` will be deleted, but not `data.txt`.","tricky":["all three files, because ? can also match zero characters","only data.txt, because each ? matches zero characters"],"obvious":"none of the files, because rm only handles directories"},{"reference":"4.5","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"A directory contains the files `.hidden_data.txt`, `data_02.txt`, and `data.txt`. If we run `rm *.txt`, which files will be deleted?","answer":"`data_02.txt` and `data.txt` will be deleted, but not `.hidden_data.txt` because globbing does not match hidden files by default.","tricky":["all three files, including .hidden_data.txt","only data.txt, because * cannot match underscores or digits"],"obvious":"none; rm converts the files into folders instead"},{"reference":"4.6","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does the command `cp *.csv backup/` do?","answer":"Copies anything in the current directory whose name ends in `.csv` into the `backup/` directory.","tricky":["recursively finds CSV files in every subdirectory and copies them into backup","copies files into backup and then removes the original files"],"obvious":"deletes the backup directory"},{"reference":"4.7","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"Does the glob pattern `*.csv` recursively match CSV files in subdirectories of the current directory?","answer":"No — globbing is not recursive; it only matches files in the current directory.","tricky":["Yes, * automatically traverses all nested directories","Yes, but it searches only one subdirectory level below the current directory"],"obvious":"Yes, because *.csv downloads CSV files from the Internet"},{"reference":"4.8","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What happens when you run `cp *.txt data/` in a directory that contains no `.txt` files?","answer":"An error reporting that `*.txt` does not exist.","tricky":["creates an empty destination file literally named *.txt","silently succeeds because an unmatched glob always becomes an empty argument list"],"obvious":"deletes the data directory"},{"reference":"4.9","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does `rm -rf *` do?","answer":"Recursively deletes everything in the current directory and below.","tricky":["deletes only top-level regular files and leaves every subdirectory intact","deletes the parent directory as well as the files matched in the current directory"],"obvious":"lists file sizes without removing anything"},{"reference":"4.10","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does `rm -r '*'` do? Notice the single quotes around `*`.","answer":"Deletes a single file named `*` if it exists, but does not perform glob expansion due to the quotes.","tricky":["expands * and recursively deletes every matching visible entry","treats the quotes as part of the target name, searching for a name containing quote characters"],"obvious":"prints the current directory and exits"},{"reference":"4.11","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does `mkdir data_{1,2,3}` expand to?","answer":"`mkdir data_1 data_2 data_3`.","tricky":["`mkdir data_1,2,3` — one argument with commas","`mkdir data_1 data_2` — the final value is excluded"],"obvious":"`rm data_1 data_2 data_3`"},{"reference":"4.12","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does `mkdir data_{a,b}{1,2,3}` expand to?","answer":"`mkdir data_a1 data_a2 data_a3 data_b1 data_b2 data_b3`.","tricky":["`mkdir data_a1 data_b2` — pairs the two lists instead of combining them","`mkdir data_a1 data_a2 data_a3 data_b` — expands the numeric list only for a"],"obvious":"`rm data_a1 data_b1`"},{"reference":"4.13","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What is the correct way to assign a string \"Hello world!\" to a variable named `greeting`?","answer":"`greeting=\"Hello world!\"` or `greeting='Hello world!'` (with quotes to prevent word splitting).","tricky":["`greeting = \"Hello world!\"` — spaces belong on both sides of =","`greeting=Hello world!` — the space in the value does not need quotes"],"obvious":"`mkdir greeting \"Hello world!\"`"},{"reference":"4.14","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"After setting `number=42`, how do you print the value of `number` using `echo`?","answer":"`echo $number`.","tricky":["`echo number`","`echo '$number'`"],"obvious":"`mkdir number`"},{"reference":"4.15","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"After `x=42`, what does `echo $x + 1` print?","answer":"`42 + 1` — shell variables are just strings and there is no arithmetic.","tricky":["`43` — echo evaluates the addition automatically","`421` — echo concatenates the value and the digit, dropping spaces and the plus sign"],"obvious":"`x` — numeric variables cannot be displayed"},{"reference":"4.16","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm *.csv`?","answer":"Two — `data1.csv` and `data2.csv` — because globbing is case-sensitive and does not match `data3.CSV`.","tricky":["Three — the pattern also matches data3.CSV because extensions ignore case","One — rm receives the literal *.csv even though files match the pattern"],"obvious":"Zero — rm never receives file names as arguments"},{"reference":"4.17","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm \"*.csv\"`?","answer":"One — the literal string `*.csv` — because quotes prevent glob expansion.","tricky":["Two — double quotes still allow *.csv to expand to both lowercase CSV paths","Three — double quotes make matching case-insensitive, so all three files match"],"obvious":"Zero — double quotes cause rm to receive no arguments at all"},{"reference":"4.18","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm '*.csv'`?","answer":"One — the literal string `*.csv` — because single quotes also prevent glob expansion.","tricky":["Two — single quotes still allow *.csv to expand to both lowercase CSV paths","Three — single quotes remove the case restriction on the pattern"],"obvious":"Zero — single quotes make rm stop accepting arguments"},{"reference":"4.19","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"The current directory contains three files: `data1.csv`, `data2.csv`, and `data3.CSV`. How many arguments does `rm` receive in `rm *.txt`?","answer":"One -- the literal string `*.txt` -- because there are no files matching the glob pattern, so it is not expanded.","tricky":["Zero — an unmatched glob is always removed from the argument list","Three — an unmatched extension makes the shell fall back to matching every file"],"obvious":"Two — the command name rm counts as two file arguments"},{"reference":"4.20","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"Suppose we set `x=\"foo bar baz\"` and run `cd $x`. How many arguments does `cd` receive?","answer":"Three — `foo`, `bar`, and `baz` — because the variable is expanded and then word splitting occurs on the whitespace.","tricky":["One — variable expansion always preserves embedded spaces as a single argument","Zero — a variable containing spaces is discarded before cd runs"],"obvious":"Four — cd itself counts as an additional directory argument"},{"reference":"4.21","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"A file is named \"2026 report.txt\" (with a space in the name). What command would you use to delete this file?","answer":"`rm \"2026 report.txt\"` or `rm '2026 report.txt'` (with quotes to prevent word splitting on the space).","tricky":["`rm 2026 report.txt` — the space is automatically kept inside one file name","`rm \"$2026 report.txt\"` — a dollar sign is required before a numeric file name"],"obvious":"`pwd \"2026 report.txt\"`"},{"reference":"4.22","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"After setting `name=Justin`, what does `echo '$name'` print? Notice the quotes.","answer":"The literal string `$name` — single quotes prevent variable expansion.","tricky":["Justin — single quotes allow variable expansion just like double quotes","name — single quotes remove the dollar sign but keep the variable name"],"obvious":"The contents of the home directory"},{"reference":"4.23","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"After setting `name=Justin`, what does `echo \"$name\"` print? Notice the quotes.","answer":"`Justin` — double quotes allow variable expansion.","tricky":["The literal string $name — double quotes prevent variable expansion","The literal string \"Justin\", including the double-quote characters"],"obvious":"A newly created directory named Justin"},{"reference":"4.24","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does `mkdir data_$(date +%Y-%m-%d)` do?","answer":"Creates a directory whose name is `data_` followed by today's date in `YYYY-MM-DD` format.","tricky":["creates a directory literally named data_$(date +%Y-%m-%d), without running date","creates a directory using the date format string %Y-%m-%d rather than the date output"],"obvious":"deletes every directory created today"},{"reference":"4.25","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What three text streams does the shell connect to every program it runs?","answer":"Standard input (stdin), standard output (stdout), and standard error (stderr).","tricky":["Standard input, standard output, and a separate stream named standard history","Standard input, standard error, and a separate stream named standard commands"],"obvious":"Git HEAD, the staging area, and the working tree"},{"reference":"4.26","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What is the default source of standard input for a program run in the shell?","answer":"The keyboard.","tricky":["a file named stdin in the current directory","the output of the previously executed command, even without a pipe"],"obvious":"the mouse pointer position"},{"reference":"4.27","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What is the default destination of standard output for a program run in the shell?","answer":"The terminal.","tricky":["a file named stdout in the current directory","the keyboard input buffer"],"obvious":"the system speaker"},{"reference":"4.28","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What do you press to signal end-of-input to a program reading from stdin at the terminal?","answer":"Ctrl-D.","tricky":["Ctrl-C — sends end-of-input while leaving the reading program running normally","Enter — ends the entire input stream after every line"],"obvious":"Alt-Left — closes standard input"},{"reference":"4.29","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does the pipe operator `|` do in `ls -l | wc -l`?","answer":"Connects the stdout of `ls` to the stdin of `wc -l`, so `wc -l` counts the number of lines `ls` produced.","tricky":["connects stderr of ls to stdin of wc, leaving stdout unconnected","runs both commands independently and does not pass any text between them"],"obvious":"installs wc as a Python package"},{"reference":"4.30","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does `ls -l | wc -l` compute?","answer":"The number of files and directories listed by `ls` in the current directory.","tricky":["the total size in bytes of all listed files","the number of lines of text inside every listed file"],"obvious":"the number of CPU cores in the machine"},{"reference":"4.31","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does `ps aux | grep python` do?","answer":"Lists all running processes and then filters them to show only lines containing `python`.","tricky":["lists only processes whose executable name is exactly python, excluding all other matching lines","runs grep over the names of files in the current directory instead of the process list"],"obvious":"terminates all Python processes"},{"reference":"4.32","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does `find . -name \"*.csv\" | sort | less` do?","answer":"Recursively finds all CSV files under the current directory, sorts the list, and displays the sorted results in `less`.","tricky":["finds CSV files only at the top level, sorts the paths, and views them","concatenates the contents of every CSV file and sorts all the data rows in less"],"obvious":"renames every CSV file to less"},{"reference":"4.33","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does the `>` operator do in `find . -name '*.csv' > files.txt`?","answer":"Redirects stdout to `files.txt`, overwriting the file if it already exists.","tricky":["appends the results to files.txt, keeping any old contents","redirects only error messages to files.txt, leaving normal results in the terminal"],"obvious":"deletes every matching CSV file"},{"reference":"4.34","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"What does the `>>` operator do in `find . -name '*.py' >> files.txt`?","answer":"Redirects stdout to `files.txt`, appending to the file instead of overwriting it.","tricky":["overwrites files.txt with the results, discarding any old contents","appends only error messages, leaving normal results in the terminal"],"obvious":"converts Python scripts into CSV files"},{"reference":"4.35","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"In the command `find / -name test 2> errors.txt`, what does `2>` do?","answer":"Redirects stderr to the file `errors.txt`.","tricky":["redirects stdout to errors.txt while leaving stderr in the terminal","redirects both stdout and stderr to errors.txt"],"obvious":"deletes two files named errors.txt"},{"reference":"4.36","lecture":4,"path":"lectures/04-shell_features/YSK.md","question":"In the command `find / -name test &> output.txt`, what does `&>` do?","answer":"Redirects both stdout and stderr to `output.txt`.","tricky":["redirects stdout only, leaving stderr in the terminal","redirects stderr only, leaving stdout in the terminal"],"obvious":"sorts output.txt alphabetically"},{"reference":"5.1","lecture":5,"path":"lectures/05-environment/YSK.md","question":"You set `name=\"Justin\"` and start a new shell with `bash`. What does `echo $name` print?","answer":"Nothing — shell variables are not inherited by child processes.","tricky":["Justin — every shell variable is automatically inherited by a child shell","The literal string $name — child shells do not expand variables"],"obvious":"The list of installed Python packages"},{"reference":"5.2","lecture":5,"path":"lectures/05-environment/YSK.md","question":"You run `export name=\"Justin\"` and start a new shell with `bash`. What does `echo $name` print?","answer":"`Justin` — exported variables are inherited by child processes.","tricky":["Nothing — export makes the value visible only in the parent shell","The literal string name=Justin, including the variable name and equals sign"],"obvious":"A new file named Justin"},{"reference":"5.3","lecture":5,"path":"lectures/05-environment/YSK.md","question":"What command turns a shell variable into an environment variable?","answer":"`export`","tricky":["`set NAME=value` — this marks the value for inheritance by child processes","`source NAME` — this exports any variable named NAME"],"obvious":"`mkdir NAME`"},{"reference":"5.4","lecture":5,"path":"lectures/05-environment/YSK.md","question":"After `export NAME=\"Justin\"`, which processes inherit `$NAME`?","answer":"All descendant processes (children, grandchildren, etc.).","tricky":["only direct children, but never grandchildren","all running processes, including the parent shell and unrelated processes"],"obvious":"all files in the current directory"},{"reference":"5.5","lecture":5,"path":"lectures/05-environment/YSK.md","question":"In `NAME=Justin bash`, what is the scope of `NAME`?","answer":"Only the `bash` child process, not the current shell.","tricky":["the current shell and every command it runs afterward, even after bash exits","every running shell on the machine, including unrelated terminal windows"],"obvious":"only the names of files inside the current directory"},{"reference":"5.6","lecture":5,"path":"lectures/05-environment/YSK.md","question":"What does `echo $NAME` print if `NAME` has never been set?","answer":"Nothing (undefined variables expand to empty strings).","tricky":["the literal string $NAME","an undefined-variable error in the default shell settings"],"obvious":"the current Git commit history"},{"reference":"5.7","lecture":5,"path":"lectures/05-environment/YSK.md","question":"By convention, how should environment variable names be written?","answer":"In all uppercase (e.g., `NAME`, `PATH`).","tricky":["in all lowercase, so they differ from ordinary shell variables","with a dollar sign stored as the first character of the variable name"],"obvious":"as a file name ending in .csv"},{"reference":"5.8","lecture":5,"path":"lectures/05-environment/YSK.md","question":"How do you access environment variable `NAME` in Python?","answer":"`os.environ['NAME']` (after `import os`).","tricky":["`sys.environ[\"NAME\"]`","`os.getenv[\"NAME\"]` — use square brackets on getenv rather than calling it"],"obvious":"`git log NAME`"},{"reference":"5.9","lecture":5,"path":"lectures/05-environment/YSK.md","question":"In Bash, where do you define an environment variable so it persists across shell sessions?","answer":"In `~/.profile` (or `~/.bash_profile`).","tricky":["in the terminal command history file, without executing it at startup","in a .profile file inside each project rather than a shell startup file in your home directory"],"obvious":"inside the NumPy package source code"},{"reference":"5.10","lecture":5,"path":"lectures/05-environment/YSK.md","question":"What character separates directories in `$PATH`?","answer":"A colon (`:`).","tricky":["a semicolon (`;`)","a forward slash (`/`)"],"obvious":"an emoji of a directory"},{"reference":"5.11","lecture":5,"path":"lectures/05-environment/YSK.md","question":"If `PATH=\"/usr/local/bin:/usr/bin:/bin\"` and `ls` exists in all three directories, which copy runs when you type `ls`?","answer":"`/usr/local/bin/ls`","tricky":["`/bin/ls` — the search uses the last matching directory","`/usr/bin/ls` — system directories always take priority over earlier PATH entries"],"obvious":"`/tmp/numpy.py`"},{"reference":"5.12","lecture":5,"path":"lectures/05-environment/YSK.md","question":"What does `type grep` show?","answer":"The path of the executable found via `$PATH`.","tricky":["every matching executable for grep across all PATH entries","the contents of the grep executable instead of its resolved location"],"obvious":"the number of CSV files in the current directory"},{"reference":"5.13","lecture":5,"path":"lectures/05-environment/YSK.md","question":"What does `type -a grep` show?","answer":"All matching executables for `grep` across all `$PATH` directories.","tricky":["only the first matching executable, just like type without -a","only matches inside the current directory, ignoring PATH"],"obvious":"the Git commit history of grep"},{"reference":"5.14","lecture":5,"path":"lectures/05-environment/YSK.md","question":"If `PATH=\"/usr/bin:/bin\"` and you run `export PATH=\"~/bin\"` (without including `$PATH`), what is the new value of `$PATH`?","answer":"`~/bin`","tricky":["`~/bin:/usr/bin:/bin` — assigning PATH automatically preserves its old value","`/usr/bin:/bin:~/bin` — a new PATH value is always appended"],"obvious":"`Justin`"},{"reference":"5.15","lecture":5,"path":"lectures/05-environment/YSK.md","question":"If `PATH=\"/usr/bin:/bin\"` and you run `export PATH=\"~/bin:$PATH\"`, what is `$PATH` now?","answer":"`~/bin:/usr/bin:/bin`","tricky":["`/usr/bin:/bin:~/bin` — the new directory is appended instead of prepended","`~/bin` — the old PATH is discarded even though $PATH appears in the assignment"],"obvious":"`numpy==1.23`"},{"reference":"5.16","lecture":5,"path":"lectures/05-environment/YSK.md","question":"Where should you put `export PATH=\"~/bin:$PATH\"` so it persists?","answer":"In `~/.profile` (or `~/.bash_profile`).","tricky":["in a project-local file named PATH, without arranging for the shell to read it","in ~/.bash_history, so the shell automatically executes it on every startup"],"obvious":"inside a CSV file opened by NumPy"},{"reference":"5.17","lecture":5,"path":"lectures/05-environment/YSK.md","question":"What happens if you run `export PATH=\"\"` (to empty the PATH) and then run `grep`?","answer":"You get a \"command not found\" error","tricky":["grep runs normally because /usr/bin is always searched even when PATH is empty","grep searches the current directory recursively for an executable before reporting success"],"obvious":"all files containing the word grep are deleted"},{"reference":"5.18","lecture":5,"path":"lectures/05-environment/YSK.md","question":"What variable holds the list of directories Python searches on `import`?","answer":"`sys.path`.","tricky":["the shell variable PATH, which directly stores Python import directories","`sys.argv`, which holds Python import directories rather than command-line arguments"],"obvious":"`git.status`"},{"reference":"5.19","lecture":5,"path":"lectures/05-environment/YSK.md","question":"What does `python -c 'import sys; print(sys.path)'` print?","answer":"The list of directories Python searches on `import`.","tricky":["the list of directories Bash searches for executable commands","the list of command-line arguments passed to the Python script"],"obvious":"the number of files deleted by rm"},{"reference":"5.20","lecture":5,"path":"lectures/05-environment/YSK.md","question":"What is typically the first entry in `sys.path`?","answer":"The directory containing the script being run.","tricky":["the directory containing the Python executable, regardless of the script location","the first directory listed in the shell PATH, regardless of the script location"],"obvious":"the last Git commit message"},{"reference":"5.21","lecture":5,"path":"lectures/05-environment/YSK.md","question":"How do you find where `numpy` is installed on disk?","answer":"`import numpy` and print `numpy.__path__`.","tricky":["`import numpy` and print `sys.executable`, which is the NumPy package directory","`import numpy` and print `numpy.__name__`, which is the NumPy installation path"],"obvious":"`git log numpy`"},{"reference":"5.22","lecture":5,"path":"lectures/05-environment/YSK.md","question":"What does `sys.path.append('/path/to/my/packages')` do?","answer":"Adds a directory to Python's search path so packages there can be imported.","tricky":["adds that directory to the shell PATH so executables there can be run by name","installs every package in that directory into the global Python installation"],"obvious":"deletes that directory recursively"},{"reference":"5.23","lecture":5,"path":"lectures/05-environment/YSK.md","question":"Which environment variable can be modified to contain additional directories for Python to search for packages?","answer":"`PYTHONPATH`.","tricky":["`PATH`","`PYTHONHOME`, which is the list of extra package directories to append"],"obvious":"`GIT_AUTHOR_NAME`"},{"reference":"6.1","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"Why is running `sudo pip install numpy` (without a virtual environment) generally a bad idea?","answer":"It installs numpy globally, so all projects share the same version.","tricky":["it automatically creates one separate package version for every project","sudo prevents NumPy from being imported even if installation succeeds"],"obvious":"it deletes all Git repositories on the machine"},{"reference":"6.2","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"Where does `pip install numpy` install the package by default (without a virtual environment)?","answer":"Into the system's global Python directory","tricky":["into a newly created project-specific virtual environment automatically","into the current working directory as a local numpy folder by default"],"obvious":"into the Git staging area"},{"reference":"6.3","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"What problem do Python virtual environments solve?","answer":"They let each project have its own independent set of package versions.","tricky":["they force every project to share exactly the same installed package versions","they isolate project files but keep all Python packages in a single shared global set"],"obvious":"they make the terminal list hidden files"},{"reference":"6.4","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"What command creates a virtual environment named `myenv` in the current directory?","answer":"`python3 -m venv myenv`","tricky":["`python3 -m venv` — this automatically chooses the name myenv","`python3 myenv -m venv` — the destination name goes before the -m option"],"obvious":"`git init myenv`"},{"reference":"6.5","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"What command activates a virtual environment located at `env/`?","answer":"`source env/bin/activate` while in `env`'s parent directory.","tricky":["`bash env/bin/activate` — running a child Bash changes the current shell environment","`source env/activate` — the activation script is at the environment root"],"obvious":"`git add env/`"},{"reference":"6.6","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"What command deactivates the currently-active virtual environment?","answer":"`deactivate`","tricky":["`exit` — restores the same running shell without terminating it","`source env/bin/activate` — sourcing the script again toggles the environment off"],"obvious":"`mkdir deactivate`"},{"reference":"6.7","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"When you activate a virtual environment, which path-related variables are modified?","answer":"The shell's `$PATH` and Python's `sys.path`","tricky":["only the shell PATH; Python keeps importing from the same global package paths","only Python sys.path; the shell PATH and selected Python executable stay unchanged"],"obvious":"Git HEAD and the staging area"},{"reference":"6.8","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"What happens to `$PATH` and `sys.path` when you run `deactivate`?","answer":"They are restored to their values from before activation.","tricky":["the environment package directory remains first in both paths until the terminal is restarted","both paths are cleared to empty values rather than restored"],"obvious":"the environment directory is deleted from disk"},{"reference":"6.9","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"With a virtual environment activated, what does `pip install numpy` do?","answer":"Installs numpy into the active virtual environment, not globally.","tricky":["installs into the global Python directory because pip ignores activation","installs into every virtual environment belonging to the current user"],"obvious":"stages NumPy for the next Git commit"},{"reference":"6.10","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"What command installs numpy version 1.23 specifically into the active virtual environment?","answer":"`pip install numpy==1.23`","tricky":["`pip install 'numpy>=1.23'` — pins exactly version 1.23","`pip install numpy=1.23` — one equals sign is the version-pinning syntax"],"obvious":"`mkdir numpy==1.23`"},{"reference":"6.11","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"What is a \"prompt injection\" attack?","answer":"Malicious instructions hidden inside otherwise innocuous data that the AI consumes and obeys.","tricky":["a malicious change to a model training set only; the attack cannot arrive through tool output or documents","a normal user instruction given directly to an assistant, with no hidden instructions in external data"],"obvious":"a command that recursively copies directories"},{"reference":"6.12","lecture":6,"path":"lectures/06-venvs_and_agents/YSK.md","question":"What command creates a Docker sandbox, installs opencode, and shares only the current directory with it?","answer":"`sbx run opencode`","tricky":["`sbx run` — this automatically installs and launches opencode even without naming it","`sbx opencode run` — puts the tool name before the run subcommand"],"obvious":"`git init opencode`"},{"reference":"7.1","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What command creates a new Git repository in the current directory?","answer":"`git init`","tricky":["`git add .`","`git clone .` — initializes an empty repository without copying any existing history"],"obvious":"`mkdir .csv`"},{"reference":"7.2","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"Which command stages `README.md` for the next commit?","answer":"`git add README.md`","tricky":["`git commit README.md` — this only stages the file and never creates a commit","`git restore --staged README.md`"],"obvious":"`pwd README.md`"},{"reference":"7.3","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What does `git commit -m \"foo\"` do?","answer":"Creates a new commit from the staged files with the given message.","tricky":["commits every working-tree edit, including files that were never staged","stages the files and sets a message without creating a new commit"],"obvious":"renames the repository to foo"},{"reference":"7.4","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What command shows the current state of files in the working tree and staging area?","answer":"`git status`","tricky":["`git log`","`git diff --cached` — shows the full state of both staged and unstaged files, including all untracked names"],"obvious":"`cd status`"},{"reference":"7.5","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What command shows the commit history of the repository?","answer":"`git log`","tricky":["`git status`","`git diff` — prints the sequence of previous commits rather than file differences"],"obvious":"`pwd history`"},{"reference":"7.6","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What command unstages `README.md`, leaving the working tree unchanged?","answer":"`git restore --staged README.md`","tricky":["`git restore README.md`","`git restore --staged --worktree README.md` — only unstages the file, preserving working-tree edits"],"obvious":"`mkdir README.md`"},{"reference":"7.7","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What command discards working-tree changes to `README.md` by restoring it from the staging area?","answer":"`git restore README.md`","tricky":["`git restore --staged README.md`","`git add README.md`"],"obvious":"`pwd README.md`"},{"reference":"7.8","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What command restores `README.md` in the working tree to its contents at commit `a1b2c3`?","answer":"`git restore --source a1b2c3 README.md`","tricky":["`git restore --source a1b2c3 --staged README.md` — updates the working tree without changing the index","`git restore README.md` — always reads from a1b2c3 even if the staging area differs"],"obvious":"`git log a1b2c3 README.md`"},{"reference":"7.9","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What are the three \"trees\" that Git uses to track your files?","answer":"The working tree, the staging area, and HEAD.","tricky":["the working tree, the staging area, and the remote repository instead of HEAD","the working tree, the commit message, and the remote repository"],"obvious":"stdin, stdout, and stderr"},{"reference":"7.10","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What does the working tree contain?","answer":"The actual files in your project directory.","tricky":["the file snapshots captured by the most recent git add, regardless of later edits","the saved snapshot in the most recent commit rather than the files currently on disk"],"obvious":"the command manual pages"},{"reference":"7.11","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What does the staging area contain?","answer":"The files as they were when you last staged them.","tricky":["the live working-tree contents, automatically updated after every edit","only the files in the last commit, even after git add stages new changes"],"obvious":"the shell command history"},{"reference":"7.12","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"What does HEAD refer to?","answer":"The files as they were in the last commit.","tricky":["the latest staged versions, even before a commit is created","the live working-tree contents, including edits that have never been committed"],"obvious":"the default destination of stderr"},{"reference":"7.13","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"Which tree does `git add <file>` modify?","answer":"The staging area.","tricky":["HEAD, creating a new committed snapshot immediately","the working tree, replacing its contents with the previous commit"],"obvious":"the terminal color theme"},{"reference":"7.14","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"Which tree does `git commit` modify?","answer":"`HEAD`.","tricky":["the working tree, replacing local files with the staging-area versions","the remote repository, even when no push is run"],"obvious":"the shell PATH variable"},{"reference":"7.15","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"Which command copies `<file>` from HEAD into the staging area?","answer":"`git restore --staged <file>`","tricky":["`git restore <file>`","`git add <file>`"],"obvious":"`pwd <file>`"},{"reference":"7.16","lecture":7,"path":"lectures/07-git-I/YSK.md","question":"Which command copies `<file>` from the staging area into the working tree?","answer":"`git restore <file>`","tricky":["`git restore --staged <file>`","`git add <file>`"],"obvious":"`mkdir <file>`"},{"reference":"8.1","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What is the name of the single branch that every new Git repo starts with?","answer":"`main`","tricky":["`HEAD`","`origin/main`"],"obvious":"`.gitignore`"},{"reference":"8.2","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What command creates a new branch called `alpha` and switches to it?","answer":"`git switch -c alpha`","tricky":["`git branch alpha`","`git switch alpha`"],"obvious":"`git log alpha`"},{"reference":"8.3","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What command switches to an existing branch named `alpha`?","answer":"`git switch alpha`","tricky":["`git switch -c alpha`","`git branch alpha`"],"obvious":"`git status alpha`"},{"reference":"8.4","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"When you run `git switch alpha`, which of the three trees are updated?","answer":"All three: HEAD, the staging area, and the working tree.","tricky":["HEAD only; the staging area and working tree keep the previous branch contents","HEAD and the working tree only; the staging area keeps the previous branch contents"],"obvious":"The shell PATH and Python sys.path"},{"reference":"8.5","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What command lists all branches in the current repo?","answer":"`git branch`","tricky":["`git branch --show-current`","`git log --all`"],"obvious":"`mkdir branches`"},{"reference":"8.6","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What command deletes a branch named `alpha`?","answer":"`git branch -d alpha`","tricky":["`git switch -d alpha`","`git branch --delete main`"],"obvious":"`pwd alpha`"},{"reference":"8.7","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What command merges the branch `alpha` into the current branch?","answer":"`git merge alpha`","tricky":["`git switch alpha` followed by `git merge main`, which always merges alpha into the original current branch","`git rebase alpha`"],"obvious":"`git log alpha`"},{"reference":"8.8","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What sequence of commands merges branch `alpha` into `main`?","answer":"`git switch main` followed by `git merge alpha`.","tricky":["`git switch alpha` followed by `git merge main`","`git switch main` followed by `git merge main`"],"obvious":"`mkdir alpha main`"},{"reference":"8.9","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What command aborts an in-progress merge and returns to the pre-merge state?","answer":"`git merge --abort`","tricky":["`git merge --quit`","`git reset --soft HEAD`"],"obvious":"`git log --oneline`"},{"reference":"8.10","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What command merges `alpha` into the current branch, but if there are conflicts, it automatically resolves them in favor of the current branch's changes?","answer":"`git merge -X ours alpha`","tricky":["`git merge -X theirs alpha`","`git merge --no-commit alpha`"],"obvious":"`git status alpha`"},{"reference":"8.11","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What command merges `alpha` into the current branch, but if there are conflicts, it automatically resolves them in favor of `alpha`'s changes?","answer":"`git merge -X theirs alpha`","tricky":["`git merge -X ours alpha`","`git merge --no-ff alpha`"],"obvious":"`git log alpha`"},{"reference":"8.12","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What command moves HEAD to a specific commit `a1b2c3` that is not associated with any branch?","answer":"`git switch --detach a1b2c3`","tricky":["`git switch a1b2c3` without --detach, treating the commit as a branch name","`git branch a1b2c3`, which creates a branch name but does not move HEAD"],"obvious":"`mkdir a1b2c3`"},{"reference":"8.13","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What is a detached HEAD?","answer":"A state where HEAD points directly at a commit instead of at a branch.","tricky":["A state where HEAD still points at a branch, but that branch has no remote tracking branch","A state where the staging area is empty while HEAD still points at the current branch"],"obvious":"A state where the terminal has no keyboard input"},{"reference":"8.14","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"Why is committing while in a detached HEAD state dangerous?","answer":"The new commits are not reachable from any branch, so they will eventually be garbage collected.","tricky":["Switching away immediately overwrites the last main commit with the detached commit","Detached commits are automatically added to main, so they can silently change that branch"],"obvious":"Creating a detached commit deletes every file in the working directory"},{"reference":"8.15","lecture":8,"path":"lectures/08-git-II/YSK.md","question":"What does git do with commits that are not reachable from any branch?","answer":"They are eventually garbage collected.","tricky":["They are automatically attached to main so that no commits can be lost","They remain permanently protected even after all reflog entries and other references expire"],"obvious":"They are converted into Python packages"},{"reference":"9.1","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"Why is it a bad idea to commit large non-text files (e.g., PDFs, images, datasets) to a Git repo?","answer":"Git stores a copy of every version of every file, so they consume lots of space and slow down operations like `git status`.","tricky":["Git replaces old binary versions with the newest copy, so previous versions cannot be recovered","Git refuses to track non-text files at all, even when explicitly added"],"obvious":"Committing an image disables the shell PATH"},{"reference":"9.2","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"What is the name of the file used to tell Git which files to ignore?","answer":"`.gitignore`","tricky":["`.gitconfig`","`.gitattributes`"],"obvious":"`requirements.txt`"},{"reference":"9.3","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"Where in the project is the `.gitignore` file usually placed?","answer":"At the root of the project.","tricky":["Inside the .git metadata directory as .git/.gitignore","Only in the project parent directory, outside the repository"],"obvious":"Inside the Python executable"},{"reference":"9.4","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"In a `.gitignore` file, what does the line `*.pdf` do?","answer":"Tells Git to ignore all files whose names end in `.pdf`.","tricky":["Ignores PDF files only at the repository root, never PDFs inside subdirectories","Deletes PDF files already tracked in the repository and removes them from past commits"],"obvious":"Installs a PDF reader"},{"reference":"9.5","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"According to the recommended solo workflow, what state should the `main` branch always be in?","answer":"A \"clean\" state — e.g., the code should run without errors.","tricky":["An experimental state with unfinished changes committed directly before testing","A state with no commits at all until the entire project is finished"],"obvious":"A detached HEAD state at all times"},{"reference":"9.6","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"According to the recommended solo workflow, where should new work be done?","answer":"On a new feature branch, not directly on `main`.","tricky":["Directly on main, with feature branches created only after the work is finished","In detached HEAD, without creating any branch to retain the new commits"],"obvious":"Inside the .gitignore file"},{"reference":"9.7","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"What is a \"feature branch\"?","answer":"A branch created for a single task, feature, or experiment, separate from `main`.","tricky":["A branch that must contain every unrelated task in the project","A staging-area snapshot that cannot have its own commits"],"obvious":"A shell environment variable named FEATURE"},{"reference":"9.8","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"What does a \"squash merge\" do?","answer":"Combines all the commits from a branch into a single commit on the target branch.","tricky":["Creates a two-parent merge commit and keeps every feature commit in the target branch history","Moves all target-branch commits onto the feature branch without combining them"],"obvious":"Compresses the project into a ZIP file"},{"reference":"9.9","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"What command performs a squash merge of the branch `feature` into the current branch?","answer":"`git merge --squash feature`","tricky":["`git merge --no-ff feature`","`git rebase feature`"],"obvious":"`git log feature`"},{"reference":"9.10","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"After running `git merge --squash feature`, what step is required to actually record the merge?","answer":"Run `git commit` to create the squashed commit.","tricky":["Run `git merge --continue`, because --squash leaves a normal in-progress merge with MERGE_HEAD","Run `git add .` only; staging the result automatically records the squashed commit"],"obvious":"Run `pwd` to save the commit history"},{"reference":"9.11","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"After squash-merging a branch `feature` into `main`, what command deletes the `feature` branch?","answer":"`git branch -D feature`","tricky":["`git branch -d feature` — always succeeds after a squash merge, even if the original feature commits are not ancestors of main","`git switch -d feature`"],"obvious":"`mkdir feature`"},{"reference":"9.12","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"In GitHub Flow, how is a feature branch merged into `main`?","answer":"By opening a pull request on GitHub and merging it there.","tricky":["By merging locally into main and pushing main directly, without opening a pull request","By opening a GitHub issue; closing the issue automatically merges the feature branch"],"obvious":"By adding the branch name to .gitignore"},{"reference":"9.13","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"After committing changes to a local feature branch, what must you do before opening a pull request?","answer":"Push the branch to GitHub.","tricky":["Merge the feature branch into local main first; uploading the feature branch is unnecessary","Stage the local files with git add; GitHub can open a pull request using staged files without a push"],"obvious":"Delete the local .git directory"},{"reference":"9.14","lecture":9,"path":"lectures/09-git-III/YSK.md","question":"What Git feature lets several AI agents work on the same repository in parallel, each on its own branch in its own directory?","answer":"Worktrees (`git worktree`).","tricky":["Stashes (`git stash`) — each stash provides a separate branch checkout directory","Branches alone (`git branch`) — every branch automatically has its own directory without a worktree"],"obvious":"The PATH environment variable"},{"reference":"10.1","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What two older Python tools does `uv` replace?","answer":"`pip` and `python -m venv`.","tricky":["`pip` and `git`","`python -m venv` and `pytest`"],"obvious":"`ls` and `rm`"},{"reference":"10.2","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"Which file does `uv init` create to hold a project's metadata and dependencies?","answer":"`pyproject.toml`.","tricky":["`uv.lock`","`requirements.txt`"],"obvious":"`main.py`"},{"reference":"10.3","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What command adds `numpy` as a dependency to a uv project?","answer":"`uv add numpy`.","tricky":["`uv pip install numpy`","`uv lock --upgrade-package numpy`"],"obvious":"`git add numpy`"},{"reference":"10.4","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What does the command `uv add \"numpy==2.4.4\"` do?","answer":"Adds numpy pinned to exactly version 2.4.4.","tricky":["Adds numpy with a minimum version of 2.4.4, allowing later versions","Adds numpy at any version in the 2.4 series, including versions other than 2.4.4"],"obvious":"Runs the NumPy test suite without changing dependencies"},{"reference":"10.5","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What command removes `numpy` from a uv project?","answer":"`uv remove numpy`.","tricky":["`uv pip uninstall numpy`","`uv lock --remove numpy`"],"obvious":"`git branch -d numpy`"},{"reference":"10.6","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What command upgrades only `numpy` to its latest allowed version?","answer":"`uv lock --upgrade-package numpy`.","tricky":["`uv lock --upgrade`","`uv sync`"],"obvious":"`git log numpy`"},{"reference":"10.7","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What command upgrades all dependencies in a uv project to their latest allowed versions?","answer":"`uv lock --upgrade`.","tricky":["`uv lock --upgrade-package numpy`","`uv sync`"],"obvious":"`git status`"},{"reference":"10.8","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What command activates a uv project's virtual environment in a bash shell?","answer":"`source .venv/bin/activate`.","tricky":["`bash .venv/bin/activate`","`source .venv/activate`"],"obvious":"`git switch .venv`"},{"reference":"10.9","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What does `uv run pytest` do?","answer":"Runs `pytest` inside the project's virtual environment.","tricky":["Installs pytest as a declared project dependency and stops without running the tests","Runs pytest outside the project environment, ignoring the project dependencies"],"obvious":"Creates a Git branch called pytest"},{"reference":"10.10","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What does `uvx ruff` do?","answer":"Installs and runs `ruff` outside of a project.","tricky":["Adds ruff to the current project dependencies before running it in the project environment","Requires ruff to be installed in the current project virtual environment and runs that copy only"],"obvious":"Reformats every file in the current repository without needing a Ruff command"},{"reference":"10.11","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What does `uv sync` do?","answer":"Updates the virtual environment to match the dependencies declared in `pyproject.toml` and `uv.lock`.","tricky":["Upgrades every locked dependency to its newest allowed version on every invocation","Rewrites the declared dependencies to match any extra packages manually installed in the environment"],"obvious":"Pushes local Git commits to GitHub"},{"reference":"10.12","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What is the purpose of the `uv.lock` file?","answer":"It records the exact version of every installed package (and every recursive dependency) so the environment can be reproduced.","tricky":["Stores only acceptable version ranges for direct dependencies, leaving transitive versions unrecorded","Stores the installed package source files themselves instead of dependency versions"],"obvious":"Stores the repository commit history"},{"reference":"10.13","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"After cloning a uv project from GitHub, what single command sets up an identical virtual environment?","answer":"`uv sync`.","tricky":["`uv lock`","`uv venv`"],"obvious":"`git init`"},{"reference":"10.14","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What is a \"dev dependency\"?","answer":"A package needed only during development (e.g., a linter or test runner), not at runtime.","tricky":["A package needed by the application at runtime, but never by development tools","A package that must be installed globally because it cannot be included in a project environment"],"obvious":"A Git branch whose name starts with dev"},{"reference":"10.15","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What command adds `ruff` as a dev dependency?","answer":"`uv add --dev ruff`.","tricky":["`uv add ruff`","`uv pip install ruff`"],"obvious":"`git add ruff`"},{"reference":"10.16","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What does a *linter* do?","answer":"Checks code for potential errors and style issues.","tricky":["Rewrites code layout only, without checking for potential bugs such as unused imports","Runs the program test cases and decides whether their expected outputs match"],"obvious":"Installs project dependencies into a virtual environment"},{"reference":"10.17","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What command uses ruff to check `main.py` for lint errors?","answer":"`ruff check main.py`.","tricky":["`ruff format main.py`","`ruff main.py`"],"obvious":"`git status main.py`"},{"reference":"10.18","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What command uses ruff to automatically fix the lint errors it finds in `main.py`?","answer":"`ruff check --fix main.py`.","tricky":["`ruff check main.py`","`ruff format main.py`"],"obvious":"`git log main.py`"},{"reference":"10.19","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What command uses ruff to reformat `main.py` according to its style rules?","answer":"`ruff format main.py`.","tricky":["`ruff check --fix main.py`","`ruff format --check main.py`"],"obvious":"`git branch main.py`"},{"reference":"10.20","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"What is PEP8?","answer":"The official Python style guide.","tricky":["The standard that defines Python package version-number syntax","The specification for the Python build-backend interface used by packaging tools"],"obvious":"A command that deletes Python virtual environments"},{"reference":"10.21","lecture":10,"path":"lectures/10-python_projects/YSK.md","question":"According to PEP8, what naming convention should be used for variable and function names?","answer":"`snake_case`.","tricky":["`camelCase`","`PascalCase`"],"obvious":"`names containing spaces`"}];

function choose(i,q){if(!round||round.selected!==null)return;round.selected=i;attempts++;if(i===round.correct)score++;else setProgress(q.id,'wrong');render();keepInView()}

let q=qs[index],topic=q.topic.replace(/^The /,''),top=`<div class="card-top"><span class="tag" title="Lecture ${q.lecture} · ${escape(plain(topic))}">Lecture ${q.lecture} · ${fmt(topic)}</span><a href="https://github.com/${source}/blob/main/${q.path}" target="_blank" rel="noopener" class="hint">Source ↗</a></div>`,content,actions,keys;
if(mode==='practice'){if(!round)round=makeRound(q);let done=round.selected!==null,tf=round.type==='tf';content=`${tf?'<p class="hint">True or false: is the answer below correct?</p>':''}<h2 class="question" id="question">${fmt(q.q)}</h2>${tf?`<div class="answer" style="margin-bottom:20px">${fmt(round.proposed)}</div>`:''}<div class="options">${round.options.map((o,i)=>`<button class="option ${done?(i===round.correct?'correct':i===round.selected?'wrong':''):''}" id="option-${i}" data-choice="${i}" ${done?'disabled':''}>${tf?'':String.fromCharCode(65+i)+'. '}${fmt(o)}</button>`).join('')}</div><div class="feedback">${done?`${round.selected===round.correct?'Correct':'Incorrect'}<br>Answer: ${fmt(q.a)}`:''}</div>`;actions=`<span class="hint" style="padding:12px">${score} / ${attempts} correct</span><button id="next" class="primary" ${done?'':'disabled'}>${index===qs.length-1?'Finish':'Next →'}</button>`;keys=`${tf?'<kbd>T</kbd> / <kbd>F</kbd> or <kbd>1</kbd> / <kbd>2</kbd> answer':'<kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> choose'} · <kbd>Enter</kbd> or <kbd>→</kbd> next`}
else{content=`<h2 class="question" id="question">${fmt(q.q)}</h2><div class="answer-zone">${flipped?`<div class="answer">${fmt(q.a)}</div>`:'<button id="flip" class="primary reveal-in-card">Show answer</button>'}</div>`;actions=`<button id="prev" aria-label="Previous question">← Previous</button>${flipped?'<button id="flip" class="quiet">Hide answer</button>':''}<button id="next" aria-label="Next question">Next →</button>${flipped?'<button id="again">Review again</button><button id="master">Knew it</button>':''}`;keys=`<kbd>Space</kbd> show / hide answer · <kbd>←</kbd> <kbd>→</kbd> previous / next · after the answer: <kbd>1</kbd> knew it · <kbd>2</kbd> review again`}
let cat=CATS[mode==='practice'?'sleep':flipped?'up':'idle'];$('#surface').innerHTML=`${notice?`<p class="notice">${notice}</p>`:''}${mode==='practice'&&pendingPractice()?`<p class="notice">${pendingPractice()} questions awaiting practice options.</p>`:''}<div class="progress">${beads(qs)}</div><section class="card" aria-labelledby="question">${top}${content}<img class="cat" alt="" src="${cat}"></section><div class="actions">${actions}</div><p class="shortcut-note">${keys}</p>`;

function parseYSK(text,path){let folder=path.split('/')[1],n=+folder.match(/^\d+/)[0],title=folder.replace(/^\d+-?/,'').replace(/[_-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),topic='General',q=null,last=null,out=[],unanswered=0;for(let line of text.split(/\r?\n/)){let answer=line.match(/^\s*(?:[-*]\s+)?\*\*Answer:?\*\*:?\s*(.*)$/i);if(/^#{1,6} /.test(line)){if(q)unanswered++;topic=line.replace(/^#+ /,'').trim();q=last=null}else if(answer&&q){last={id:folder+':'+q,lecture:n,title,topic,q,a:answer[1].trim(),path};out.push(last);q=null}else if(/^[-*] /.test(line)){if(q)unanswered++;q=line.slice(2).trim();last=null}else if(last&&/^\s+\S/.test(line))last.a=(last.a+' '+line.trim().replace(/^[-*]\s+/,'')).trim();else if(!line.trim())last=null}if(q)unanswered++;let questions=out.filter(x=>x.a);return{questions,unanswered:unanswered+out.length-questions.length}}
